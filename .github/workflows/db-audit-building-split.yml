name: Audit building split

# 土地と建物の推定内訳（積算評価）の分布を実データで数える。**読み取りだけ。**
#
# 単価表は目安なので、京都で回して分布と実例を目視してから全国に広げる。
# SELECT しかしないので行は変えない。夜間巡回と重ねて回さないこと。

on:
  workflow_dispatch:
    inputs:
      prefecture:
        description: "都道府県名で絞る（例: 京都府）。「全国」で絞らない（空にしても default に落ちるだけなので、全国は言葉で指定する）"
        required: false
        default: "京都府"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh

      - name: Audit
        env:
          SPLIT_AUDIT_PREF: ${{ inputs.prefecture }}
        run: npx tsx scripts/audit_building_split.ts | tee -a "$GITHUB_STEP_SUMMARY"
