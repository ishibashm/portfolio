name: Check PM2 Logs

on:
  workflow_dispatch:

# WIF の OIDC トークン発行に id-token: write が要る。
permissions:
  contents: read
  id-token: write

jobs:
  check-logs:
    runs-on: ubuntu-latest

    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          # JSON 鍵（GCP_SA_KEY）をやめ、Workload Identity Federation で短命トークンを得る。
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get PM2 Logs
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            echo '=== PM2 Status ==='
            pm2 status
            echo ''
            echo '=== PM2 Logs (Last 100 lines) ==='
            pm2 logs portfolio --lines 100 --nostream
          "
