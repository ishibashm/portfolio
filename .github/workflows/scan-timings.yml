name: Read arbitrage scan timings

# 物件走査（/api/rentals/arbitrage）が本番で実際に何ミリ秒かかっているかを
# **読むだけ**のワークフロー。
#
# ## なぜ要るか
#
# 走査の API は 1 回ごとに
#
#     arbitrage: db 880ms / compute 120ms (pref=all radius=50 rows=500/126800 …)
#
# を console.log している。ところがこれを**集めて見る口が無く**、速さの
# 話はずっと db-explain の 1 点測定（名古屋 50km で 880ms）と「本番は数秒」
# という感触で進めていた。速くする手を打つ前に、**利用者が実際に待っている
# 分布**（中央値・9 割点・最大）を出す。「速くなるはず」で作ると、#767 の
# ように副作用で別のものを変える（CLAUDE.md 6 節）。
#
# ## 出さないもの
#
# run-error-logs.yml と同じ。httpRequest（URL・IP・UA）は読まない。
# 出すのは走査の所要時間と、県・半径・件数だけ。座標も生年月日も
# ログの本文に含まれていない（route.ts の 1 行を見れば分かる）。
#
# ## 書き込みは一切しない
#
# gcloud logging read だけ。

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "さかのぼる時間（時間）"
        required: false
        default: "24"
      limit:
        description: "最大件数（新しい順）"
        required: false
        default: "2000"

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'blog-471319' }}
  REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'portfolio-app' }}

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Read timings
        env:
          HOURS: ${{ inputs.hours }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          since=$(date -u -d "-${HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)
          filter="resource.type=\"cloud_run_revision\""
          filter="$filter AND resource.labels.service_name=\"${SERVICE_NAME}\""
          filter="$filter AND resource.labels.location=\"${REGION}\""
          filter="$filter AND timestamp>=\"${since}\""
          # 走った走査（arbitrage: db）と、#1178 で行数の上限で止めた走査
          # （arbitrage: paused）の両方を読む。止めたぶんは所要時間の分布に
          # 入らないので、別に数える。
          filter="$filter AND (textPayload:\"arbitrage: db\" OR textPayload:\"arbitrage: paused\")"
          echo "filter: $filter"

          gcloud logging read "$filter" \
            --project="${PROJECT_ID}" \
            --limit="${LIMIT}" \
            --format=json > logs.json

          # 1 行 = 1 走査。db, compute, pref, radius, rows(取得/総数), 時刻(JST の時) を列にする。
          # 時刻は「遅い回が夜間の巡回（scrape-rentals.yml、04:17 JST から最長
          # 6 時間）と重なっているか」を見るため。db-explain は巡回の外で
          # 測っていて、同じ行数で本番の 20 分の 1 だった（backlog 19 節）。
          jq -r '
            .[] | select((.textPayload // .jsonPayload.message // "") | test("arbitrage: db"))
              | "\(.timestamp)\t\(.textPayload // .jsonPayload.message)"' logs.json \
          | sed -E 's/^([0-9-]+)T([0-9]{2}):([0-9]{2}:[0-9]{2})[^\t]*\t.*db ([0-9]+)ms \/ compute ([0-9]+)ms \(pref=([^ ]*) radius=([^ ]*) rows=([0-9]+)\/([0-9]+).*/\4\t\5\t\6\t\7\t\8\t\9\t\2\t\1 \2:\3Z/' \
          | awk -F'\t' -v OFS='\t' '{ $7 = ($7 + 9) % 24; print }' \
          | grep -P '^[0-9]+\t' > rows.tsv || true

          n=$(wc -l < rows.tsv | tr -d ' ')

          # 止めた走査: rows, pref, radius を列にする
          jq -r '
            .[] | (.textPayload // .jsonPayload.message // "")
              | select(test("arbitrage: paused"))' logs.json \
          | sed -E 's/.*paused rows=([0-9]+) \(pref=([^ ]*) radius=([^ )]*)\).*/\1\t\2\t\3/' \
          | grep -P '^[0-9]+\t' > paused.tsv || true
          np=$(wc -l < paused.tsv | tr -d ' ')

          # 列番号を渡して 件数 / 中央値 / 9 割点 / 最大 を出す
          stats() {
            local col="$1"
            sort -n -k"$col","$col" -t$'\t' rows.tsv | awk -F'\t' -v c="$col" '
              { v[NR] = $c }
              END {
                if (NR == 0) { print "0\t-\t-\t-"; exit }
                med = v[int((NR + 1) / 2)]
                p90 = v[int(NR * 0.9) < 1 ? 1 : int(NR * 0.9)]
                printf "%d\t%d\t%d\t%d\n", NR, med, p90, v[NR]
              }'
          }

          {
            echo "## 物件走査の所要時間（直近 ${HOURS} 時間・走った ${n} 回・止めた ${np} 回）"
            echo
            echo "- service: \`${SERVICE_NAME}\` / region: \`${REGION}\`"
            echo "- 上限 ${LIMIT}。上限に達していたら hours を短くする"
            echo
            if [ "$n" -gt 0 ] || [ "$np" -gt 0 ]; then
              echo "| 区間 | 回数 | 中央値 ms | 9 割点 ms | 最大 ms |"
              echo "| --- | --- | --- | --- | --- |"
              printf "| DB（候補の切り出し） | %s | %s | %s | %s |\n" $(stats 1)
              printf "| 計算（判定・スコア） | %s | %s | %s | %s |\n" $(stats 2)
              echo
              echo "### 県の指定の有無で分ける（DB の中央値）"
              echo
              echo '```'
              # mawk は配列の配列を持てないので、群ごとに切り出してから測る
              for grp in all pref; do
                if [ "$grp" = all ]; then awk -F'\t' '$3 == "all"' rows.tsv; else awk -F'\t' '$3 != "all"' rows.tsv; fi \
                  | cut -f1 | sort -n \
                  | awk -v g="$grp" '{ v[NR]=$1 } END { if (NR) printf "pref=%-6s n=%-5d median=%dms p90=%dms max=%dms\n", g, NR, v[int((NR+1)/2)], v[int(NR*0.9)<1?1:int(NR*0.9)], v[NR]; else printf "pref=%-6s n=0\n", g }'
              done
              echo '```'
              echo
              echo "### 取得行数 / 総件数（上限 500 に当たった回数）"
              echo
              echo '```'
              awk -F'\t' '$5 >= 500 { hit++ } END { printf "上限に当たった: %d / %d 回\n", hit + 0, NR }' rows.tsv
              awk -F'\t' '{ print $6 }' rows.tsv | sort -n | awk '{ v[NR]=$1 } END { if (NR) printf "総件数 中央値=%d  9割点=%d  最大=%d\n", v[int((NR+1)/2)], v[int(NR*0.9)<1?1:int(NR*0.9)], v[NR] }'
              echo '```'
              echo
              echo "### 時間帯（JST）ごとの DB 所要時間。* は夜間の巡回と重なる時間帯（04〜10 時）"
              echo
              echo '```'
              # 時ごとに n / 中央値 / 最大。mawk で通るよう、時ごとに切り出してから測る
              for h in $(cut -f7 rows.tsv | sort -n | uniq); do
                mark=" "
                if [ "$h" -ge 4 ] && [ "$h" -le 10 ]; then mark="*"; fi
                awk -F'\t' -v h="$h" '$7 == h { print $1 }' rows.tsv | sort -n \
                  | awk -v h="$h" -v m="$mark" '{ v[NR]=$1 } END { printf "%s%02d 時  n=%-4d median=%6dms  max=%6dms\n", m, h, NR, v[int((NR+1)/2)], v[NR] }'
              done
              echo
              for grp in crawl quiet; do
                if [ "$grp" = crawl ]; then awk -F'\t' '$7 >= 4 && $7 <= 10' rows.tsv; else awk -F'\t' '$7 < 4 || $7 > 10' rows.tsv; fi \
                  | cut -f1 | sort -n \
                  | awk -v g="$grp" '{ v[NR]=$1 } END { if (NR) printf "%-5s n=%-5d median=%dms p90=%dms max=%dms\n", (g=="crawl"?"巡回中":"巡回外"), NR, v[int((NR+1)/2)], v[int(NR*0.9)<1?1:int(NR*0.9)], v[NR]; else printf "%-5s n=0\n", (g=="crawl"?"巡回中":"巡回外") }'
              done
              echo '```'
              echo
              echo "### 行数の上限で止めた走査（#1178。走らせていないので上の分布には入らない）"
              echo
              echo '```'
              if [ "$np" -gt 0 ]; then
                echo "止めた: ${np} 回（走った ${n} 回とは別）"
                awk -F'\t' '{ print $1 }' paused.tsv | sort -n | awk '{ v[NR]=$1 } END { printf "当たった行数 最小=%d  中央値=%d  最大=%d\n", v[1], v[int((NR+1)/2)], v[NR] }'
                awk -F'\t' '{ k = "pref=" $2 " radius=" $3; c[k]++ } END { for (k in c) printf "%s\t%d 回\n", k, c[k] }' paused.tsv | sort -t$'\t' -k2,2rn | head -10
              else
                echo "止めた走査はありません。"
              fi
              echo '```'
              echo
              echo "### 遅かった順（先頭 15 件）"
              echo
              echo '```'
              # 8 列目は UTC の時刻（秒まで）。遅い回が数秒おきに並んでいれば、
              # 地図を動かすたびに投げた走査が DB で積み重なっている
              echo -e "db_ms\tcompute_ms\tpref\tradius\trows\ttotal\thour_jst\tat_utc"
              sort -rn -k1,1 -t$'\t' rows.tsv | head -15
              echo '```'
            else
              echo "この範囲に走査のログはありません。"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
