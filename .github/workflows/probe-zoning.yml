name: Probe zoning

# 用途地域（都市計画決定情報）を**実物で確かめるだけ**。
#
# 「商業地域などの区分を地図で見たい」という要望に対して、まずどの API が
# どんな形で返すのかを見る。開発環境からは mlit.go.jp に出られない
# （egress で 403）ので、ここで確かめる以外に手が無い。
#
# **外部 API を読むだけで、DB には一切書かない。**DATABASE_URL も要らない。

on:
  workflow_dispatch:
    inputs:
      target:
        description: "upstream = 上流を直接／relay = 本番の /api/zoning を外から／catalog = ex-api に何があるか一覧（路線価を探す）／simplify = 間引いたらどこまで軽くなるか"
        required: false
        default: "upstream"
        type: choice
        options:
          - upstream
          - relay
          - catalog
          - simplify

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env

      # `!= 'relay'` と書いてあったので **catalog を選んでも upstream が
      # 走っていた。**選んだものだけが走るように直す。
      - name: Probe upstream
        if: ${{ inputs.target == 'upstream' || inputs.target == '' }}
        run: npx tsx scripts/probe_zoning.ts | tee -a "$GITHUB_STEP_SUMMARY"

      # 本番の中継を外から叩く。鍵は要らない（サーバ側が持っている）。
      # 「通るはず」で済ませないための確認で、鍵が本番に渡っているかも、
      # 上流が本番の IP を通すかも、ここでしか分からない。
      - name: Probe relay
        if: ${{ inputs.target == 'relay' }}
        run: npx tsx scripts/probe_zoning_relay.ts | tee -a "$GITHUB_STEP_SUMMARY"

      # ex-api に何があるかの一覧。路線価を探すために足した。
      # 応答の _index が中身を名乗るので、ID を総当たりすれば一覧にできる。
      - name: Probe catalog
        if: ${{ inputs.target == 'catalog' }}
        run: npx tsx scripts/probe_reinfolib_catalog.ts | tee -a "$GITHUB_STEP_SUMMARY"

      # 用途地域は z14 より広くは出していない（1 タイルが z13 で 435KB、
      # z12 で 1.9MB。画面には十数タイル並ぶ）。広い縮尺ほど頂点は要らない
      # はずなので、間引いてどこまで減るかを測る。**推測で実装を書かない。**
      - name: Probe simplify
        if: ${{ inputs.target == 'simplify' }}
        run: npx tsx scripts/probe_zoning_simplify.ts | tee -a "$GITHUB_STEP_SUMMARY"
