# 国土数値情報 A29（用途地域）の一括ファイルが何があるかを見る。
# 既定はダウンロードしない（HEAD と一覧ページの GET だけ）。
#
# inspect_pref に県コード（2 桁）を入れたときだけ、その県の A29-19 の
# zip を 1 本だけ取って中身（ファイル名と大きさ、GeoJSON があれば
# 1 件目の属性）を見る。**取り込みの前に、形式を目で確かめる**ため。
# 小さい県を指定すること（鳥取 31 / 島根 32 / 高知 39 など）。
#
# 作業環境からは nlftp.mlit.go.jp に届かない（経路の方針で 403）ので、
# Actions で回す。probe-zoning と同じ作法。
name: Probe KSJ

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "見るデータ（A29 = 用途地域 / N02 = 鉄道）"
        required: false
        default: "A29"
      inspect_pref:
        description: "中身を見る（A29 は県コード 2 桁。全国 1 本のデータは何か入れる。空なら見ない）。A29 は小さい県を指定する"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Probe
        env:
          DATASET: ${{ inputs.dataset || 'A29' }}
          INSPECT_PREF: ${{ inputs.inspect_pref }}
          INSPECT_URL_FILE: /tmp/ksj_inspect_url.txt
        run: npx tsx scripts/probe_ksj.ts --dataset "$DATASET" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect one archive
        if: ${{ inputs.inspect_pref != '' }}
        run: |
          set -euo pipefail
          if [ ! -s /tmp/ksj_inspect_url.txt ]; then
            echo "probe が中身を見る 1 本を選べなかった。終わる。" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          URL="$(cat /tmp/ksj_inspect_url.txt)"
          echo "## 4. 1 本の中身（$URL）" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          curl -sS -L -A "cloud-palette-ksj-probe/1.0 (https://cloud-palette.com; contact via site)" \
            -o /tmp/a29.zip "$URL"
          ls -l /tmp/a29.zip
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          unzip -l /tmp/a29.zip | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/a29 && unzip -q -o /tmp/a29.zip -d /tmp/a29
          # GeoJSON は複数あり得る（N02 は路線と駅）。先頭 4 本まで見る
          FOUND=0
          while IFS= read -r GJ; do
            [ -n "$GJ" ] || continue
            FOUND=1
            echo "GeoJSON: $GJ ($(stat -c %s "$GJ") bytes)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            # 1 件目の属性と座標の先頭だけ。ファイル全体は出さない
            node -e '
              const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              console.log("features:", j.features.length, "crs:", JSON.stringify(j.crs ?? null));
              const f=j.features[0];
              console.log("properties:", JSON.stringify(f.properties));
              const c=f.geometry.coordinates; const first=Array.isArray(c[0])?(Array.isArray(c[0][0])?c[0][0]:c[0]):c;
              console.log("geometry.type:", f.geometry.type, "first coord:", JSON.stringify(first));
              const keys=new Map(); for (const g of j.features) for (const [k,v] of Object.entries(g.properties)) { const s=keys.get(k)??new Set(); if (s.size<6) s.add(String(v)); keys.set(k,s); }
              for (const [k,s] of keys) console.log(k, "=>", [...s].join(" | "));
            ' "$GJ" | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done < <(find /tmp/a29 -iname '*.geojson' | sort | head -4)
          if [ "$FOUND" = 0 ]; then
            echo "GeoJSON は無い（shp / xml だけ）" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
