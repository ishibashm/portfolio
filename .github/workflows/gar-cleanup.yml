name: Artifact Registry cleanup

# Artifact Registry に溜まったコンテナイメージを数え、必要なら消す。
#
# ## なぜ要るか
#
# deploy.yml は master へ push されるたびに `github.sha` をタグにした
# イメージを push するが、**古いイメージを消す処理がどこにも無い。**
# 単調に増え続けるので、保管料も増え続ける。
#
# 実測（2026-08-21 に report を回した結果）:
#
#   版数              368
#   リポジトリ全体   約 128 GB（130,935 MB）
#   リポジトリ作成   2026-08-08（13 日前）
#   ポリシー         **1 つも無い**
#
# **13 日で 128 GB。**1 日あたり約 28 版・約 10 GB。Artifact Registry は
# $0.10/GB/月（最初の 0.5 GB は無料）なので、現状で月 12〜13 ドル。
# 頭打ちが無く、1 か月放置すれば 300 GB・月 30 ドルに届く。
#
# 最も古い版が 13 日前で止まっているのは、ポリシーが消しているからでは
# なく**リポジトリ自体が新しい**ため。describe の createTime で確認した。
#
# ## サイズをどこから取るか
#
# **版ごとのサイズは `docker images list` の JSON に入っていない。**
# 実測したキーは createTime / metadata / package / tags / updateTime /
# version の 6 つだけ。最初の実装は sizeBytes を読もうとして全件 0 と
# 数え、「消しても料金は変わらない」と読める報告を出していた（#467）。
#
# 正しくは `repositories describe` の sizeBytes。こちらは層の共有を
# 重複計上しない**課金対象そのもの**の数字で、版を足し合わせるより正確。
#
# ## 保管先を替える案は採らない
#
# **Cloud Run は Artifact Registry（と旧 GCR）からしかイメージを引けない。**
# Cloudflare など他所へ移す選択肢は無い。増え方を止めるのが正しい。
#
# ## mode
#
#   report  数えるだけ。**何も消さない。**既定
#   apply   delete_older_than より古い版を消す（既定 7d）。ただし
#           keep_versions 世代は日数に関わらず残す（床）
#
# **report を先に回すこと。**削除は取り消せない。消したイメージを参照
# している Cloud Run のリビジョンには、以後ロールバックできなくなる。

on:
  # 毎週。**掃除そのものは GCP 側のポリシーがやる**（apply が
  # set-cleanup-policies を当て、以後は GCP が自動で古い版を消す）ので、
  # ここでの定期実行は 2 つの役目しかない。
  #
  #   1. ポリシーが外れていないかを毎週当て直す（同じ内容なので無害）
  #   2. 容量とリビジョン数を Summary に残し、増え方の変化に気付く
  #
  # 毎日ではなく毎週にしてある。実測（2026-09-08）では 7 日ぶんが
  # 38 GB で釣り合っており、日単位で見る必要が無いため。
  schedule:
    - cron: "17 20 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "report（数えるだけ） / apply（実際に消す）"
        type: choice
        options:
          - report
          - apply
        default: report
      delete_older_than:
        description: "これより古い版を消す（7d / 14d / 30d）。apply のときだけ効く"
        type: string
        default: "7d"
      keep_versions:
        description: "日数に関わらず必ず残す世代数（床）。apply のときだけ効く"
        type: string
        default: "20"

env:
  # schedule で起動したときは inputs が空になる。**空のまま参照すると
  # mode が report でも apply でもない値になり、どちらのステップも
  # 走らずに緑で終わる**（気付けない）。ここで既定に倒す。
  MODE: ${{ inputs.mode || 'apply' }}
  DELETE_OLDER_THAN: ${{ inputs.delete_older_than || '7d' }}
  KEEP_VERSIONS: ${{ inputs.keep_versions || '20' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'blog-471319' }}
  # 既定は deploy.yml と揃える（asia-northeast1）。ずれると、実際に
  # 溜まっているのと別のレジストリを掃除して「0 件でした」で緑になる。
  REGION: ${{ vars.GCP_REGION || 'asia-northeast1' }}
  REPOSITORY: ${{ vars.GCP_REPOSITORY || 'portfolio-repo' }}
  IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME || 'portfolio-app' }}
  # Cloud Run 側の名前。deploy.yml と同じ既定に合わせる。
  SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'portfolio-app' }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Inventory every repository in every location
        run: |
          set -euo pipefail
          # **請求と突き合わせるための棚卸し。**
          #
          # この下の全ステップは REPOSITORY（portfolio-repo）× REGION
          # （asia-northeast1）の **1 つだけ**を見る。それで測った 37.9 GB を
          # 「Artifact Registry の実サイズ」として報告していたが、
          # 2026-09-09 の請求（9/03〜9/09 の 7 日で AR ¥397）から逆算すると
          # **課金対象は約 113 GB** で、3 倍のひらきがあった。
          #
          # $0.10/GB/月 ＝ 約 ¥15/GB/月 ＝ 約 ¥0.5/GB/日。¥397 ÷ 7 日 ÷ 0.5
          # ≒ 113 GB。1 つのリポジトリしか見ていなければ、他のリポジトリや
          # 他のロケーション（us-central1 に残骸がある）は数に入らない。
          #
          # **消す前に、まず全部を数える。**--location=- で全ロケーションを
          # 横断する（既定は 1 つだけ）。読むだけで何も消さない。
          gcloud artifacts repositories list \
            --project="${{ env.PROJECT_ID }}" \
            --location=- \
            --format="value(name, format, sizeBytes, createTime)" \
            > repos.tsv || true
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          rows = []
          with open("repos.tsv", encoding="utf-8") as f:
              for line in f:
                  parts = line.rstrip("\n").split("\t")
                  if len(parts) < 3 or not parts[0]:
                      continue
                  try:
                      size = int(parts[2] or 0)
                  except ValueError:
                      size = 0
                  rows.append((parts[0], parts[1], size, parts[3] if len(parts) > 3 else ""))
          rows.sort(key=lambda r: -r[2])
          total = sum(r[2] for r in rows)
          print("## Artifact Registry の全リポジトリ（全ロケーション）")
          print()
          if not rows:
              print("`repositories list` が 1 件も返さなかった。権限か API を確認する。")
          else:
              print("| リポジトリ | 形式 | サイズ | 作成 |")
              print("| --- | --- | ---: | --- |")
              for name, fmt, size, created in rows:
                  print(f"| `{name}` | {fmt} | {size / 1e9:.2f} GB | {created[:10]} |")
              print()
              print(f"**合計 {total / 1e9:.2f} GB**（{len(rows)} リポジトリ）。")
              print()
              print(
                  "$0.10/GB/月 なので月 **約 ¥"
                  f"{total / 1e9 * 15:.0f}**（1 ドル 150 円・無料枠 0.5 GB を無視した概算）。"
              )
              print()
              print(
                  "請求書の Artifact Registry と桁が合わなければ、**まだ数えていない"
                  "ものがある**。合っていれば、どのリポジトリを削るかがここで決まる。"
              )
          PY

      - name: Show existing cleanup policies
        run: |
          set -euo pipefail
          # 初回の report で「最も古い版が 13 日前」という結果が出た。
          # 既にポリシーが当たっているのか、単に運用開始が新しいだけなのかで
          # apply の要否が変わるので、現状を先に出す。
          gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --project="${{ env.PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            --format="yaml(name, createTime, cleanupPolicies, cleanupPolicyDryRun)" \
            | tee policies.yaml
          {
            echo "## 現在のクリーンアップポリシー"
            echo
            echo '```yaml'
            cat policies.yaml
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        id: report
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "対象: $IMAGE"

          # 版ごとのサイズは docker images list の JSON に入っていない（実測した
          # キーは createTime / metadata / package / tags / updateTime / version）。
          # リポジトリ全体のサイズは describe が sizeBytes で返し、**そちらは層の
          # 共有を重複計上しない課金対象そのもの**。版を足し合わせるより正確。
          #
          # export しないと下の python から os.environ で読めない。
          # 読めないと「取得できず」に落ちるだけだが、黙って 0 にする経路を
          # 潰した意味が無くなるので、ここで確実に渡す。
          export REPO_SIZE_BYTES
          REPO_SIZE_BYTES="$(gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --project="${{ env.PROJECT_ID }}" --location="${{ env.REGION }}" \
            --format="value(sizeBytes)" 2>/dev/null || true)"

          gcloud artifacts docker images list "$IMAGE" \
            --include-tags --sort-by=~CREATE_TIME --format="json" > images.json

          python3 - <<'PY' | tee report.md
          import json, os
          rows = json.load(open("images.json"))
          keep = int(os.environ.get("KEEP", "20"))
          raw = (os.environ.get("REPO_SIZE_BYTES") or "").strip()
          try:
              repo_bytes = int(raw)
          except ValueError:
              repo_bytes = None

          gb = lambda b: b / 1024 ** 3
          old = rows[keep:]

          print("## Artifact Registry の現状")
          print()
          print(f"- イメージの版数: **{len(rows)}**")
          if rows:
              print(f"- 最も古い版: {rows[-1].get('createTime', '不明')}")
              print(f"- 最も新しい版: {rows[0].get('createTime', '不明')}")

          if repo_bytes is None:
              # 取れなかったときに 0 と書くと「消しても効かない」と読める。
              # 数字を出さず、取れなかったことを書く。
              print("- 合計サイズ: **取得できず**（describe が sizeBytes を返さなかった）")
          else:
              size_gb = gb(repo_bytes)
              # 0.5 GB までは無料。超えたぶんが $0.10/GB/月。
              bill = max(0.0, size_gb - 0.5) * 0.10
              print(f"- 合計サイズ: **{size_gb:.1f} GB**（リポジトリの申告値。層の共有を含まない実量）")
              print(f"- 概算の保管料: **${bill:.2f}/月**")

          print()
          print(f"## 最新 {keep} 世代を残した場合")
          print()
          print(f"- 削除対象: **{len(old)} 版**")
          print()
          print("**容量の削減見込みは出せない。**版ごとのサイズが応答に無く、層が")
          print(f"共有されているため「{len(old)} 版消せば何 GB 減る」を事前に計算できない。")
          print("apply したあと、この report を回し直して合計サイズの変化で確かめること。")
          PY
          cat report.md >> "$GITHUB_STEP_SUMMARY"
        env:
          KEEP: ${{ env.KEEP_VERSIONS }}

      - name: Inventory
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

          # 「具体的に何が入っているのか」を出す。版の一覧だけでは
          # 中身が分からず、消してよいかの判断ができない。
          #
          #   revisions   … Cloud Run が参照している版。**ここに入って
          #                 いない版は誰も使っていない**
          #   files list  … 実際に保管されている blob（層）。**サイズを
          #                 持つのはここだけ**。何が重いのかが分かる
          #
          # **重い話（層）を最後に置く。**リビジョンは 300 件を超えて
          # いてログの尾を埋めてしまい、肝心の層の内訳が読めなかった。

          echo "## 直近 10 版" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"
          gcloud artifacts docker images list "$IMAGE" \
            --include-tags --sort-by=~CREATE_TIME --limit=10 \
            --format="table(version, tags, createTime.date('%Y-%m-%d %H:%M'))" 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo '```' | tee -a "$GITHUB_STEP_SUMMARY"

          # Cloud Run のリビジョン。**数だけ数えて、明細は 10 件に絞る。**
          # 1 リビジョン 1 行で全部出すと数百行になり、後ろの出力が
          # ログの尾から溢れる（実際に溢れて読めなかった）。
          gcloud run revisions list \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --service="${{ env.SERVICE_NAME }}" \
            --format="value(metadata.name)" > revisions.txt 2>/dev/null || : > revisions.txt
          REV_COUNT="$(wc -l < revisions.txt | tr -d ' ')"
          {
            echo ""
            echo "## Cloud Run のリビジョン"
            echo ""
            echo "- 総数: **${REV_COUNT}**"
            echo ""
            echo "**リビジョンは 1 つずつイメージを指している。**古い版を消すと、"
            echo "そのリビジョンへは以後ロールバックできなくなる。"
            echo ""
            echo "新しい順に 10 件:"
            echo ""
            echo '```'
            head -10 revisions.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # 層ごとのサイズ。ここがいちばん知りたいので最後に出す。
          gcloud artifacts files list \
            --project="${{ env.PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            --repository="${{ env.REPOSITORY }}" \
            --format="json" > files.json 2>/dev/null || echo "[]" > files.json

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          files = json.load(open("files.json"))
          def sz(f):
              try:
                  return int(f.get("sizeBytes") or 0)
              except (TypeError, ValueError):
                  return 0
          mb = lambda b: b / 1024 ** 2
          total = sum(sz(f) for f in files)
          print()
          print("## 保管されている層（blob）")
          print()
          if not files:
              print("files list が空だった（権限か、この口が使えない）。")
          else:
              print(f"- 層の数: **{len(files)}**")
              print(f"- 合計: **{mb(total)/1024:.1f} GB**")
              big = sorted(files, key=sz, reverse=True)[:10]
              print(f"- 最大の層: **{mb(sz(big[0])):.0f} MB**")
              print()
              # 100MB 超がいくつあるかで「毎回作り直されている層」が見える
              heavy = [f for f in files if sz(f) > 100 * 1024 ** 2]
              print(f"- 100 MB を超える層: **{len(heavy)} 個 / {mb(sum(sz(f) for f in heavy))/1024:.1f} GB**")
              print()
              print("同じ内容の層は 1 度しか保管されない。それでも大きい層が")
              print("版数ぶん並ぶなら、**毎回の build で中身が変わっている**。")
              print()
              print("大きい順に 10 件:")
              print()
              print("| サイズ | 作成 |")
              print("|---|---|")
              for f in big:
                  print(f"| {mb(sz(f)):.0f} MB | {f.get('createTime','')[:16]} |")
          PY

      - name: Apply cleanup policy
        if: ${{ env.MODE == 'apply' }}
        run: |
          set -euo pipefail
          # GCP 標準のクリーンアップポリシー。以後は GCP 側が自動で消すので、
          # このワークフローを定期実行する必要は無い。
          #
          # ## 世代数ではなく日数で切る
          #
          # 1 日あたり約 28 回デプロイしているので、「20 世代」は**半日**しか
          # ない。「7 日ぶん残したい」を世代数で言うと約 196 になるが、
          # デプロイの回数は日によって 3 倍以上ぶれる（1 日で最大 52 回）ので、
          # 固定の世代数では意図した期間にならない。だから delete 側を
          # 日数（olderThan）にする。
          #
          # keepCount は**床**として残す。デプロイが止まった週に、日数だけの
          # 条件だと全部消えてしまうため。Keep 規則は Delete 規則より強いので、
          # 「7 日より古くても、新しいほうから 20 世代は必ず残る」となる。
          cat > policy.json <<EOF
          [
            {
              "name": "keep-recent",
              "action": {"type": "Keep"},
              "mostRecentVersions": {
                "keepCount": ${{ env.KEEP_VERSIONS }}
              }
            },
            {
              "name": "delete-old",
              "action": {"type": "Delete"},
              "condition": {"olderThan": "${{ env.DELETE_OLDER_THAN }}"}
            }
          ]
          EOF
          echo "適用するポリシー:"
          cat policy.json

          gcloud artifacts repositories set-cleanup-policies "${{ env.REPOSITORY }}" \
            --project="${{ env.PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            --policy=policy.json

          echo "クリーンアップポリシーを適用した。" >> "$GITHUB_STEP_SUMMARY"
          echo "以後は GCP 側が自動で古い版を消す。週次の schedule は、ポリシーが外れていないかの当て直しと、容量の記録のために回している。" >> "$GITHUB_STEP_SUMMARY"

          gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
            --project="${{ env.PROJECT_ID }}" \
            --location="${{ env.REGION }}" \
            --format="yaml(cleanupPolicies)"

      - name: Prune old Cloud Run revisions
        if: ${{ env.MODE == 'apply' }}
        run: |
          set -euo pipefail
          # リビジョンは版を指すだけの入れ物で、配信していなければ課金
          # されない。それでも整理するのは 2 つの理由から。
          #
          #   1. **1 サービスあたりの上限がある。**2026-09-08 の実測で
          #      1,055 個まで来ていた。上限に当たるとデプロイが失敗する
          #   2. 7 日より古い版はイメージ側が既に消えているので、その
          #      リビジョンはロールバック先として使えない。残しても
          #      一覧が読みにくくなるだけ
          #
          # **配信中のリビジョンには手を触れない。**traffic に載っている
          # ものを先に取って除外する。新しい順に KEEP_REVISIONS 個も残す
          # （イメージ側のポリシーが 20 世代を床にしているので、それより
          # 多めに取る）。
          KEEP_REVISIONS=60
          # 1 回の run で扱う上限。gcloud は 1 件ずつしか扱えず遅いので、
          # 全部を 1 回でやろうとすると timeout-minutes を超える。
          # 週次で少しずつ減らす。
          MAX_PER_RUN=300

          gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --format="value(status.traffic[].revisionName)" \
            | tr ';,' '\n\n' | tr -d ' ' | grep -v '^$' > serving.txt || : > serving.txt
          echo "配信中のリビジョン:"; cat serving.txt

          gcloud run revisions list \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --service="${{ env.SERVICE_NAME }}" \
            --sort-by="~metadata.creationTimestamp" \
            --format="value(metadata.name)" > all.txt

          TOTAL="$(wc -l < all.txt | tr -d ' ')"
          tail -n +$((KEEP_REVISIONS + 1)) all.txt > candidates.txt || : > candidates.txt
          # 配信中を除く。serving.txt が空のとき grep -f は全部を落として
          # しまうので、その場合は候補をそのまま使う。
          if [ -s serving.txt ]; then
            grep -vxF -f serving.txt candidates.txt > targets.txt || : > targets.txt
          else
            cp candidates.txt targets.txt
          fi
          head -n "$MAX_PER_RUN" targets.txt > batch.txt || : > batch.txt
          N="$(wc -l < batch.txt | tr -d ' ')"

          {
            echo ""
            echo "## Cloud Run のリビジョン"
            echo ""
            echo "- 総数: **$TOTAL**（新しい順に $KEEP_REVISIONS 個と配信中は残す）"
            echo "- 今回の対象: **$N**（1 回の上限 $MAX_PER_RUN）"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          FAILED=0
          while read -r rev; do
            [ -n "$rev" ] || continue
            gcloud run revisions delete "$rev" \
              --project="${{ env.PROJECT_ID }}" \
              --region="${{ env.REGION }}" \
              --quiet || FAILED=$((FAILED + 1))
          done < batch.txt

          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED 個は扱えなかった（配信中・保護されている等）。次回に持ち越す。" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "残り $(( $(wc -l < targets.txt | tr -d ' ') - N )) 個は次回。" \
            | tee -a "$GITHUB_STEP_SUMMARY"
