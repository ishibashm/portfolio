name: Apply DB indexes

# rental_properties にスキャナー用のインデックスを張る。
#
# このテーブルだけインデックスが 1 つも無く（主キーの uuid と url の unique のみ）、
# 絞り込みに使う列が無索引で、シーケンシャルスキャンになっていた。とくに
# 鮮度表示の max(last_seen_at) は絞り込み条件を持たないため、リクエストごとに
# 全行を読む（2026-08-09 の実測で 45 万行・225MB、130 ms）。
#
# 手元から DB に繋げなくても当てられるように、ランナー上で psql を回す。
# 接続情報は Secret の ENV_FILE から取るので、実行者の手元にもログにも出ない。
#
# prisma db push でも作れるが、その場合 CREATE INDEX が排他ロックを取り、
# 張り終わるまで書き込みが止まる。夜間のスクレイパーと重なると取り込みが
# 詰まるので、ここでは CONCURRENTLY で当てる。
#
# 実際の DDL は scripts/sql/rental_properties_indexes.sql にある。
# インデックスの定義そのものは prisma/schema.prisma にも書いてあること。
# db push はスキーマに無いインデックスを削除するため、ここで作っただけだと
# 次の run-seed で消える。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify: 現状を見るだけ / apply: 実際に張る"
        required: true
        type: choice
        options:
          - verify
          - apply
        default: verify

# rental_properties に ACCESS EXCLUSIVE を取る処理と直列化する。
#
# purge_rental_properties.ts は毎回無条件に VACUUM (FULL, ANALYZE) を打ち、
# dedupe_rental_properties.ts も削除が 50,000 行を超えると打つ。どちらも
# scrape-rentals.yml の geocode ジョブと db-capacity.yml の中で走る。
#
# VACUUM FULL の ACCESS EXCLUSIVE は、CREATE INDEX CONCURRENTLY が取る
# SHARE UPDATE EXCLUSIVE と競合する。重なると片方が長時間待たされ、
# CIC 側が落ちれば INVALID な索引が残る。
#
# 3 つのワークフローで同じグループ名を使い、順番に流す。
concurrency:
  group: rental-properties-write
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # 実クエリの計測に scripts/explain_arbitrage_query.ts を使う。
      # pg と dotenv が要るので依存を入れる。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DIRECT_URL が要る。"
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh

      # DIRECT_URL はプーラを経由しない直結。CONCURRENTLY はセッションを
      # またぐと成立しないので、プーラ側の DATABASE_URL は使わない。
      - name: Resolve connection
        run: |
          set -euo pipefail
          URL="$(sed -n 's/^DIRECT_URL=//p' .env | tail -1)"
          if [ -z "$URL" ]; then
            echo "::error::.env に DIRECT_URL が無い。"
            exit 1
          fi

          # 接続文字列は sslmode=verify-full で、証明書の検証を要求する。
          # libpq は既定で ~/.postgresql/root.crt を見にいくが、ランナーには
          # 無いので「root certificate file does not exist」で落ちる。
          # db.cloud-palette.com の証明書は公的な CA が出しているので、
          # OS の証明書ストアを使えば検証が通る。
          #
          # sslmode を緩めるほうは採らない。ここは資格情報を載せる接続で、
          # 検証を切ると中間者に対して無防備になる。
          case "$URL" in
            *sslrootcert=*) ;;
            *\?*) URL="${URL}&sslrootcert=system" ;;
            *)    URL="${URL}?sslrootcert=system" ;;
          esac

          # 資格情報はログに出さない。マスクしたうえで後続ステップへ渡す。
          echo "::add-mask::$URL"
          echo "PGURL=$URL" >> "$GITHUB_ENV"

      # 資格情報を伏せたまま、どこへ繋がったかだけ残す。
      - name: Connection check
        run: |
          set -euo pipefail
          psql "$PGURL" -At -c "
            SELECT 'connected: ' || current_database()
                   || ' @ ' || inet_server_addr()
                   || '  ' || split_part(version(), ' on ', 1);"

      - name: Before
        run: |
          set -euo pipefail
          {
            echo "## 実行前"
            echo '```'
            psql "$PGURL" -At -c "SELECT 'rows: ' || count(*) FROM rental_properties;"
            psql "$PGURL" -At -c "SELECT 'table size: ' || pg_size_pretty(pg_total_relation_size('rental_properties'));"
            echo "-- indexes --"
            psql "$PGURL" -At -c "
              SELECT indexrelid::regclass || '  valid=' || indisvalid
                FROM pg_index WHERE indrelid = 'rental_properties'::regclass;"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 索引は読み取りを速くする代わりに、書き込みのたびに更新コストを払う。
      # rental_properties は毎晩 upsert される書き込み中心のテーブルで、
      # ジオコーダは lat/lon をまとめて UPDATE する。索引を増やした分だけ
      # 取り込みが遅くなり、県あたりの時間予算で回るスクレイパーは
      # カバー範囲が減る。読み取りが速くなっても差し引きで損になりうる。
      #
      # HOT 更新率が最も直接の指標。更新した列に索引が無ければ Postgres は
      # 同じページ内で完結させられる（HOT）が、索引があると索引側も直す
      # 必要があり HOT にできない。last_seen_at は再訪のたびに更新されるので
      # ここが効く。
      #
      # 索引を減らすときは読み取りの価値が低い順に落とす。
      #   1. last_seen_at  max() が 130ms→0.05ms。ただし全体 23.7 秒の 0.5%
      #   2. lat, lon      半径・表示範囲の絞り込み。全国表示では使われない
      #   3. address       県の絞り込み。address は挿入時に書かれて以降ほぼ
      #                    更新されないため、維持コストがいちばん低い
      - name: Write cost
        run: |
          set -euo pipefail
          {
            echo "## 書き込みコストの指標"
            echo '```'
            psql "$PGURL" -c "
              SELECT n_tup_ins AS ins, n_tup_upd AS upd, n_tup_hot_upd AS hot_upd,
                     CASE WHEN n_tup_upd > 0
                          THEN round(100.0 * n_tup_hot_upd / n_tup_upd, 1)
                     END AS hot_pct,
                     n_dead_tup AS dead,
                     last_autovacuum, last_analyze
                FROM pg_stat_user_tables WHERE relname = 'rental_properties';"
            echo "-- 索引ごとの使われ方とサイズ --"
            psql "$PGURL" -c "
              SELECT indexrelname AS name, idx_scan AS scans,
                     pg_size_pretty(pg_relation_size(indexrelid)) AS size
                FROM pg_stat_user_indexes WHERE relname = 'rental_properties'
               ORDER BY idx_scan DESC;"
            echo '```'
            echo "> hot_pct が下がっていたら索引が書き込みの足を引っ張っている。"
            echo "> scans が 0 のままの索引は読み取りに寄与しておらず、維持コストだけ払っている。"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # スキャナーが実際に投げる 4 本を、API と同じ SQL 生成関数から組み立てて
      # 測る。どれが重いのかを推測せずに決めるため。
      #
      # prefecture=all は絞り込みが最も緩い最悪ケース。ここが許容範囲なら
      # 個別の県はそれより速い。
      - name: Measure the real scanner queries (before)
        env:
          EXPLAIN_PREFECTURE: all
          EXPLAIN_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          {
            echo "## 実行前：スキャナーの実クエリ"
            echo '```'
            npx -y tsx scripts/explain_arbitrage_query.ts
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply indexes
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          # CONCURRENTLY はトランザクション内で実行できないため
          # --single-transaction を付けない。ON_ERROR_STOP は付ける。
          psql "$PGURL" -v ON_ERROR_STOP=1 -f scripts/sql/rental_properties_indexes.sql

      - name: After
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          {
            echo "## 実行後"
            echo '```'
            psql "$PGURL" -At -c "
              SELECT indexrelid::regclass || '  valid=' || indisvalid
                     || '  ' || pg_size_pretty(pg_relation_size(indexrelid))
                FROM pg_index WHERE indrelid = 'rental_properties'::regclass;"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # 前と同じ 4 本を測り直す。どれがどれだけ縮んだかが並ぶ。
      - name: Measure the real scanner queries (after)
        if: ${{ inputs.mode == 'apply' }}
        env:
          EXPLAIN_PREFECTURE: all
          EXPLAIN_TIMEOUT_MS: "120000"
        run: |
          set -euo pipefail
          {
            echo "## 実行後：スキャナーの実クエリ"
            echo '```'
            npx -y tsx scripts/explain_arbitrage_query.ts
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # CONCURRENTLY は途中で失敗すると INVALID なインデックスを残す。
      # 残ったまま放置するとプランナーは使わないのに更新コストだけ payしてしまう。
      - name: Fail if any index is invalid
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          BAD="$(psql "$PGURL" -At -c "
            SELECT string_agg(indexrelid::regclass::text, ', ')
              FROM pg_index
             WHERE indrelid = 'rental_properties'::regclass AND NOT indisvalid;")"
          if [ -n "$BAD" ]; then
            echo "::error::INVALID なインデックスが残っている: $BAD"
            echo "DROP INDEX してから当て直すこと。"
            exit 1
          fi
          echo "全てのインデックスが valid。"
