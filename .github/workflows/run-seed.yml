name: Setup Database Schema and Seed Data

on:
  workflow_dispatch: # 手動で実行するためのトリガー

jobs:
  setup-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          
      - name: Auto-generate DIRECT_URL
        run: |
          # 既存のDATABASE_URLから、ポート6543を5432に置換し、DIRECT_URLを自動生成する
          DB_URL=$(grep '^DATABASE_URL=' .env | cut -d '=' -f2- | tr -d '"' | tr -d "'")
          if [[ -n "$DB_URL" ]]; then
            DIR_URL=$(echo "$DB_URL" | sed 's/:6543\//:5432\//' | sed 's/?.*//')
            echo "DIRECT_URL=\"$DIR_URL\"" >> .env
            echo "Successfully generated DIRECT_URL."
          else
            echo "DATABASE_URL not found in .env"
          fi

      - name: Push Prisma Schema to Database
        run: |
          source .env
          # Force Prisma to use the direct connection (5432) for db push by overriding DATABASE_URL
          DATABASE_URL="$DIRECT_URL" npx prisma db push --accept-data-loss

      - name: Run Data Import Scripts
        run: |
          npx tsx scripts/import_municipalities_wealth.ts
          npx tsx scripts/update_municipalities_coords.ts
          npx tsx scripts/import_land_prices.ts
