name: Geocode Land Listings

# 売地（land_listings）の座標だけを埋める。
#
# ## なぜ巡回と別のワークフローにするか（2026-09-10）
#
# 座標埋めは scrape-land.yml の最後の工程にもある。ただしあちらは
# `rental-properties-write` の直列化グループに入っているので、**夜間の
# 賃貸巡回（最長 6 時間）の後ろで待つ。**実際に待たされた
# （run 34536342459 / 34536961361。神奈川 160 分 + 奈良が走っている間、
# 座標埋めだけが 20 分以上キューにいた）。
#
# **この工程は相手サーバーに 1 回も要求しない。**触る表も land_listings
# だけで、賃貸の巡回とも VACUUM FULL とも競合しない。CLAUDE.md 3 節の
# 「ワークフロー単位の直列化は、触る表が違っても待たせる」（#488）が
# そのまま当てはまるので、**グループを分ける。**
#
# 外へ出るのは国土地理院の住所検索だけ（間隔 200ms、町丁目の永続
# キャッシュ経由）。賃貸の掲載がある町丁目には行かない。

on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: "使う分。0 で無制限"
        required: false
        default: "20"
      batch:
        description: "1 度に読む行数"
        required: false
        default: "500"

# 座標埋めどうしが重なると同じ行を二重に引く。ここだけで直列化する。
concurrency:
  group: land-listings-geocode
  cancel-in-progress: false

jobs:
  geocode:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh

      - name: Geocode land listings
        env:
          LAND_GEOCODE_TIME_BUDGET_MIN: ${{ inputs.budget_min }}
          LAND_GEOCODE_BATCH: ${{ inputs.batch }}
        run: npx -y tsx scripts/geocode_land.ts | tee -a "$GITHUB_STEP_SUMMARY"
