name: Deploy to GCP

on:
  push:
    branches: [ master ] # masterに変更

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Prepare Standalone
        run: |
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/prisma
          cp -r public/* .next/standalone/public/
          cp -r .next/static/* .next/standalone/.next/static/
          # package.jsonとpnpm-lock.yamlをコピー（サーバー側でnpm installするため）
          cp package.json .next/standalone/
          cp pnpm-lock.yaml .next/standalone/ 2>/dev/null || true
          # Prismaスキーマをコピー（Prismaクライアント生成に必要）
          cp prisma/schema.prisma .next/standalone/prisma/

      - name: Create .env from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env

      - name: Zip Artifact (excluding node_modules)
        run: |
          cd .next/standalone
          # node_modulesを除外してzipを作成（サーバー側でnpm installするため）
          zip -r ../../deploy.zip . -x "node_modules/*" "*.log"

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Transfer to VM
        run: |
          gcloud compute scp deploy.zip $INSTANCE_NAME:~/ --zone $ZONE --project $PROJECT_ID

      - name: Deploy on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            set -e  # エラー時に停止
            
            echo '=== デプロイ開始 ==='
            
            # 既存のアプリを停止
            pm2 delete portfolio || true
            echo '既存のプロセスを停止しました'
            
            # 古い.nextフォルダを削除（キャッシュ問題を防ぐ）
            rm -rf my-app/.next
            echo '古い.nextフォルダを削除しました'
            
            # node_modulesを削除（サーバー側で再インストールするため）
            rm -rf my-app/node_modules
            echo '古いnode_modulesを削除しました'
            
            # 解凍 (my-appフォルダに直接展開)
            echo 'ZIPファイルを解凍中...'
            unzip -o deploy.zip -d my-app
            rm deploy.zip
            echo '解凍完了'
            
            cd my-app
            
            # package.jsonが存在するか確認
            if [ ! -f package.json ]; then
              echo 'エラー: package.jsonが見つかりません'
              exit 1
            fi
            
            # 依存関係をインストール（Linux環境用）
            echo '依存関係をインストール中...'
            npm install --omit=dev --no-audit --no-fund
            echo '依存関係のインストール完了'
            
            # Prismaクライアントを再生成（念のため）
            echo 'Prismaクライアントを生成中...'
            npx prisma generate --schema=./prisma/schema.prisma || echo 'Prisma生成スキップ（既に生成済み）'
            
            # アプリを起動
            echo 'アプリを起動中...'
            HOSTNAME=0.0.0.0 PORT=3000 pm2 start server.js --name "portfolio" --update-env
            pm2 save
            echo 'アプリ起動完了'
            
            # ステータス確認
            sleep 2
            pm2 status
            pm2 logs portfolio --lines 20 --nostream || true
            
            echo '=== デプロイ完了 ==='
          "
