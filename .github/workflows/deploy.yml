name: Deploy to GCP

on:
  push:
    branches: [ master ] # masterに変更

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy-package
          # Standaloneではなく通常のビルド成果物を使用
          cp -r .next deploy-package/
          cp -r public deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/ 2>/dev/null || true
          cp -r prisma deploy-package/
          cp -r docs deploy-package/

      - name: Create .env from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > deploy-package/.env

      - name: Zip Artifact
        run: |
          cd deploy-package
          # node_modulesはサーバー側でインストールするため、zipには含めない
          zip -r ../deploy.zip . -x "node_modules/*"

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Transfer to VM
        run: |
          gcloud compute scp deploy.zip $INSTANCE_NAME:~/ --zone $ZONE --project $PROJECT_ID

      - name: Deploy on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            echo '=== デプロイ開始 (通常モード) ==='
            
            # ディスク容量チェック
            echo 'Disk Usage Before Cleanup:'
            df -h
            
            # キャッシュ削除で容量確保
            rm -rf ~/.npm
            npm cache clean --force
            
            # 既存のアプリを停止
            pm2 delete portfolio || true
            
            # データベースをバックアップ
            if [ -f my-app/dev.db ]; then
              cp my-app/dev.db ./dev.db.bak
            fi
            
            # クリーンアップ (npm error ENOTEMPTY 対策)
            # 既存の node_modules を完全に削除してからインストールする
            echo 'Cleaning up existing files...'
            pm2 delete portfolio || true
            rm -rf my-app
            mkdir -p my-app
            
            # 解凍
            unzip -o deploy.zip -d my-app
            rm deploy.zip
            
            # データベース復元
            if [ -f ./dev.db.bak ]; then
              mv ./dev.db.bak my-app/dev.db
            fi
            
            cd my-app
            
            # 依存関係のインストール (Standardモードでは必須)
            # ENOTEMPTYエラー対策: 既存のnode_modulesを削除してからインストール
            echo 'Installing dependencies...'
            rm -rf node_modules
            npm install --omit=dev
            
            # Prisma生成
            npx prisma generate --schema=./prisma/schema.prisma

            # データベース構造の適用 (テーブル作成)
            npx prisma db push --schema=./prisma/schema.prisma

            # データシーディング (記事の自動登録)
            npx prisma db seed

            # DBファイルの配置調整 (念のためルートにも配置)
            if [ -f prisma/dev.db ]; then
              cp prisma/dev.db ./dev.db
            fi
            
            # アプリ起動 (npm startを使用)
            echo 'Starting app...'
            HOSTNAME=0.0.0.0 PORT=3000 pm2 start npm --name "portfolio" -- start
            pm2 save
            
            echo '=== デプロイ完了 ==='
          "
