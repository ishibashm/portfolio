name: Deploy to GCP

on:
  push:
    branches: [ master ] # masterに変更

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Prepare Standalone
        run: |
          mkdir -p .next/standalone/public
          mkdir -p .next/standalone/.next/static
          mkdir -p .next/standalone/prisma
          cp -r public/* .next/standalone/public/
          cp -r .next/static/* .next/standalone/.next/static/
          # package.jsonとpnpm-lock.yamlをコピー（サーバー側でnpm installするため）
          cp package.json .next/standalone/
          cp pnpm-lock.yaml .next/standalone/ 2>/dev/null || true
          # Prismaスキーマをコピー（Prismaクライアント生成に必要）
          cp prisma/schema.prisma .next/standalone/prisma/

      - name: Create .env from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > .next/standalone/.env

      - name: Zip Artifact
        run: |
          cd .next/standalone
          # standaloneのnode_modulesを含める（Next.jsのサーバーモジュールが必要）
          # standaloneモードでは必要な依存関係のみが含まれるため、サイズはそれほど大きくない
          zip -r ../../deploy.zip . -x "*.log"

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Transfer to VM
        run: |
          gcloud compute scp deploy.zip $INSTANCE_NAME:~/ --zone $ZONE --project $PROJECT_ID

      - name: Deploy on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            set -e  # エラー時に停止
            
            echo '=== デプロイ開始 ==='
            
            # 既存のアプリを停止
            pm2 delete portfolio || true
            echo '既存のプロセスを停止しました'
            
            # 既存のmy-appを削除（新しいバージョンに置き換えるため）
            rm -rf my-app
            echo '古いmy-appフォルダを削除しました'
            
            # my-appフォルダを作成して解凍
            echo 'ZIPファイルを解凍中...'
            mkdir -p my-app
            unzip -o deploy.zip -d my-app
            rm deploy.zip
            echo '解凍完了'
            
            cd my-app
            
            # ファイル構造を確認
            echo 'ファイル構造を確認中...'
            ls -la | head -20
            
            # server.jsが存在するか確認
            if [ ! -f server.js ]; then
              echo 'エラー: server.jsが見つかりません'
              echo '現在のディレクトリ:'
              pwd
              echo 'ファイル一覧:'
              ls -la
              exit 1
            fi
            
            # node_modulesが存在するか確認
            if [ ! -d node_modules ]; then
              echo 'エラー: node_modulesが見つかりません'
              echo '現在のディレクトリ:'
              pwd
              echo 'ファイル一覧:'
              ls -la
              exit 1
            fi
            
            # Next.jsのモジュールが存在するか確認
            if [ ! -f node_modules/next/dist/server/next-server.js ]; then
              echo '警告: Next.jsのサーバーモジュールが見つかりません'
              echo 'node_modules/next/dist/server/ の内容:'
              ls -la node_modules/next/dist/server/ 2>/dev/null || echo 'ディレクトリが存在しません'
            fi
            
            # Prismaクライアントを確認（standaloneのnode_modulesに含まれているはず）
            echo 'Prismaクライアントを確認中...'
            if [ -f prisma/schema.prisma ] && [ -f node_modules/.bin/prisma ]; then
              ./node_modules/.bin/prisma generate --schema=./prisma/schema.prisma 2>/dev/null || echo 'Prisma生成スキップ（既に生成済み）'
            fi
            
            # アプリを起動
            echo 'アプリを起動中...'
            HOSTNAME=0.0.0.0 PORT=3000 pm2 start server.js --name "portfolio" --update-env
            pm2 save
            echo 'アプリ起動完了'
            
            # ステータス確認
            sleep 2
            pm2 status
            pm2 logs portfolio --lines 20 --nostream || true
            
            echo '=== デプロイ完了 ==='
          "
