name: Deploy to GCP Cloud Run (Free Tier)

on:
  push:
    branches: [master]
  # 手で起動できるようにしておく。切り戻しは Secret DATABASE_URL_OVERRIDE を
  # 消して再デプロイするだけで済むが、push でしか動かないと、そのために
  # 何かをコミットしなければならない。急いで戻したい場面で余計な手間になる。
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'blog-471319' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.GCP_SERVICE_NAME || 'portfolio-app' }}
  GAR_LOCATION: ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev
  REPOSITORY: ${{ vars.GCP_REPOSITORY || 'portfolio-repo' }}
  IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME || 'portfolio-app' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@v4

      - name: Create .env from Secret required for Build
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
          # Next.js derives Server Action IDs from this key. Generating a fresh
          # random key per deploy invalidated every action ID held by an already
          # loaded browser tab, which surfaced as "Server Action ... was not found
          # on the server". It has to stay stable across builds and instances.
          SERVER_ACTIONS_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
          # AdSense のパブリッシャー ID。ads.txt とページのソースに出る公開情報
          # なので secret ではなく variable に置く。ENV_FILE は書き込み専用で
          # 中身を読めないため、追記せず別に渡す。未設定なら広告関連の出力は
          # 一切行われない（src/lib/adsense.ts）。
          ADSENSE_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_ID }}
          # 広告ユニット（スロット）。自動広告だけで運用するなら不要。
          ADSENSE_SLOT_ARTICLE: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE }}
          ADSENSE_SLOT_LIST: ${{ vars.NEXT_PUBLIC_ADSENSE_SLOT_LIST }}
          # 履歴グラフの日次記録エンドポイント（/api/cron/telemetry）の合言葉。
          # Record Daily Telemetry ワークフローが同じ値で呼ぶ。
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # 管理画面（/admin）と管理 API を開ける唯一のアドレス。
          # ENV_FILE の中に既にあるなら、この secret は未設定でよい（下の
          # 追記は後勝ちなので、両方あればこちらが勝つ）。ENV_FILE は
          # 書き込み専用で中身を読めず、追記もできない（入れ直すには
          # .env の全文を再入力することになる）ため、単体でも渡せる口を
          # 用意しておく。CRON_SECRET と同じ形。
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          # Billing Export の参照先は秘密情報ではないため repository variables
          # から渡す。Cloud Run 実行 SA の ADC を使い、JSON 鍵は作らない。
          GCP_BILLING_EXPORT_TABLE: ${{ vars.GCP_BILLING_EXPORT_TABLE }}
          GCP_BILLING_TARGET_PROJECT_ID: ${{ vars.GCP_BILLING_TARGET_PROJECT_ID }}
          GCP_BILLING_QUERY_PROJECT_ID: ${{ vars.GCP_BILLING_QUERY_PROJECT_ID }}
          GCP_BILLING_LOCATION: ${{ vars.GCP_BILLING_LOCATION }}
          GCP_BILLING_TIMEOUT_MS: ${{ vars.GCP_BILLING_TIMEOUT_MS }}
        run: |
          if [ -z "$SERVER_ACTIONS_KEY" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY secret is not set. Set a stable base64 key (openssl rand -base64 32) or Server Actions break across deploys."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh
          echo "" >> .env
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$SERVER_ACTIONS_KEY" >> .env
          if [ -n "$ADSENSE_ID" ]; then
            echo "NEXT_PUBLIC_ADSENSE_ID=$ADSENSE_ID" >> .env
          fi
          if [ -n "$ADSENSE_SLOT_ARTICLE" ]; then
            echo "NEXT_PUBLIC_ADSENSE_SLOT_ARTICLE=$ADSENSE_SLOT_ARTICLE" >> .env
          fi
          if [ -n "$ADSENSE_SLOT_LIST" ]; then
            echo "NEXT_PUBLIC_ADSENSE_SLOT_LIST=$ADSENSE_SLOT_LIST" >> .env
          fi
          if [ -n "$CRON_SECRET" ]; then
            echo "CRON_SECRET=$CRON_SECRET" >> .env
          fi
          if [ -n "$ADMIN_EMAIL" ]; then
            echo "ADMIN_EMAIL=$ADMIN_EMAIL" >> .env
          fi
          if [ -n "$GCP_BILLING_EXPORT_TABLE" ]; then
            echo "GCP_BILLING_EXPORT_TABLE=$GCP_BILLING_EXPORT_TABLE" >> .env
            echo "GCP_BILLING_TARGET_PROJECT_ID=$GCP_BILLING_TARGET_PROJECT_ID" >> .env
            echo "GCP_BILLING_QUERY_PROJECT_ID=$GCP_BILLING_QUERY_PROJECT_ID" >> .env
            echo "GCP_BILLING_LOCATION=${GCP_BILLING_LOCATION:-US}" >> .env
            echo "GCP_BILLING_TIMEOUT_MS=${GCP_BILLING_TIMEOUT_MS:-10000}" >> .env
          fi
          # ここまでで組み上がった .env に ADMIN_EMAIL があることを確かめる。
          # 出どころは問わない（ENV_FILE の中でも、上の追記でもよい）。
          #
          # 未設定のまま出すと、管理画面と管理 API が誰にも開けなくなる
          # （utils/supabase/routeAccess.ts の isAdminEmail）。以前は逆に
          # 「ログインしていれば誰でも通る」だった。どちらも事故なので、
          # 静かに出さずにここで止める。SERVER_ACTIONS_KEY と同じ扱い。
          # grep -q なので値はログに出ない。
          if ! grep -qE '^ADMIN_EMAIL=.+' .env; then
            echo "::error::ADMIN_EMAIL is not set. Add it to the ENV_FILE secret, or register a separate ADMIN_EMAIL secret. 未設定のまま出すと /admin と /api/metrics/* が誰にも開けなくなる。"
            exit 1
          fi

      - name: Convert .env to env.json for Cloud Run
        run: python scripts/convert_env.py

      - name: Auth with GCP By Service Account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # リージョンは vars.GCP_REGION で切り替えられる作りになっているが、
      # 変えただけでは動かない。Artifact Registry のリポジトリはリージョン単位で、
      # 移設先には存在しないため docker push が "repository not found" で落ちる。
      # 変数を変えるだけで移設が完結するよう、無ければここで作る。
      - name: Ensure Artifact Registry repository exists
        run: |-
          if gcloud artifacts repositories describe "${{ env.REPOSITORY }}" \
               --project="${{ env.PROJECT_ID }}" \
               --location="${{ env.REGION }}" >/dev/null 2>&1; then
            echo "Artifact Registry ${{ env.REPOSITORY }} は ${{ env.REGION }} に既にある。"
          else
            echo "Artifact Registry ${{ env.REPOSITORY }} を ${{ env.REGION }} に作る。"
            if ! gcloud artifacts repositories create "${{ env.REPOSITORY }}" \
                   --project="${{ env.PROJECT_ID }}" \
                   --location="${{ env.REGION }}" \
                   --repository-format=docker \
                   --description="portfolio-app container images" \
                   --quiet; then
              echo "::error::Artifact Registry の作成に失敗した。サービスアカウントに roles/artifactregistry.admin が要る。先にコンソールで作っても構わない。"
              exit 1
            fi
          fi

      - name: Docker Auth for Artifact Registry
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # ## なぜ buildx と層キャッシュを使うのか
      #
      # 素の docker build は、ランナーに層キャッシュが無いので**毎回すべての
      # 層をゼロから作る。**Dockerfile の base ステージ（apt で
      # build-essential・python3-pandas/numpy、pip で yfinance）は 186 MB
      # あり、中身が同じでも生成されるファイルの mtime が変わるため
      # **層の digest が毎回変わる。**
      #
      # 層は内容アドレスなので、digest が同じなら Artifact Registry は
      # 1 度しか保管しない。digest が変わると別物として毎回保管される。
      #
      # 実測（2026-08-21 の gar-cleanup report）:
      #
      #   層の数            4352
      #   合計              124.7 GB
      #   100 MB 超の層     376 個 / 68.3 GB   ← 186 MB × 376
      #   版数              368
      #
      # 100 MB 超の層の数が版数とほぼ一致している。**同じ 186 MB を
      # 376 回保管していた。**13 日で 128 GB、1 日あたり約 10 GB。
      #
      # buildx + GitHub Actions のキャッシュにすると、base の層は
      # 再構築されず**キャッシュから元の digest のまま復元される**ので、
      # push しても既にあるものとして扱われる。増えるのは実際に変わった
      # 層（アプリのビルド成果物）だけになる。
      #
      # mode=min にしてあるのは、最終イメージに入る層だけを対象にすれば
      # 足りるため。runner ステージは FROM base なので、いちばん重い
      # base の層は min でも入る。max にすると builder 側の中間層まで
      # 抱えて GitHub のキャッシュ枠（10 GB）を食い潰し、追い出しが
      # 起きて逆に効かなくなる。
      #
      # 挙動は変えていない。同じ Dockerfile を同じ引数で建てて、同じ
      # タグで push する。secret の渡し方も id=env のまま。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # docker build の --secret id=env,src=.env と同じ。
          secret-files: |
            env=.env
          cache-from: type=gha
          # ignore-error を付けるのは、**キャッシュの失敗でデプロイを
          # 落とさない**ため。キャッシュはあくまで保管料を減らすための
          # ものなので、書き出しに失敗しても建って push できていれば
          # 目的（本番へ出す）は達している。付けないと、GitHub 側の
          # キャッシュが一時的に不調なだけでデプロイが止まる。
          cache-to: type=gha,mode=min,ignore-error=true

      # --cpu-boost はコールドスタートの間だけ CPU 割り当てを上げる。
      # min-instances=0 の構成では、最初の 1 リクエストが Node の起動と
      # モジュール読み込みを丸ごと待つ。Googlebot がこの待ちでタイムアウトし
      # クロールエラーになっていた疑いがあるため、起動だけ速くする。
      # 課金は起動中の数秒ぶんの CPU 秒だけで、無料枠の内側に収まる。
      #
      # google-github-actions/deploy-cloudrun echoes the gcloud command it runs,
      # which expands env_vars_file into --update-env-vars KEY=VALUE pairs and
      # prints every value into the Actions log. This repository is public, so
      # gcloud is invoked directly instead. Actions logs the raw script, not the
      # expanded shell variable, so $ENV_VARS_FLAG keeps the values out of it.
      - name: Deploy to Cloud Run (Free Tier Optimized)
        run: |-
          ENV_VARS_FLAG="$(python3 scripts/env_to_gcloud_flag.py env.json)"
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project="${{ env.PROJECT_ID }}" \
            --region="${{ env.REGION }}" \
            --image="${{ env.GAR_LOCATION }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --update-env-vars="$ENV_VARS_FLAG" \
            --update-labels=managed-by=github-actions,commit-sha=${{ github.sha }} \
            --cpu=1 \
            --memory=512Mi \
            --max-instances=2 \
            --min-instances=0 \
            --concurrency=80 \
            --cpu-boost \
            --allow-unauthenticated \
            --quiet

          # リージョンを移すと URL が変わる。ドメインを付け替える前に新旧を
          # 見比べる必要があるので、どこへ出たのかをサマリーに残す。
          URL="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
                   --project="${{ env.PROJECT_ID }}" \
                   --region="${{ env.REGION }}" \
                   --format='value(status.url)')"
          echo "デプロイ先: ${{ env.REGION }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "サービス URL: $URL" | tee -a "$GITHUB_STEP_SUMMARY"
