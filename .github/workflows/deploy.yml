name: Deploy to GCP

on:
  push:
    branches: [master] # masterに変更

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env from Secret required for Build
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env
          echo "" >> .env
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env

      - name: Build
        run: npm run build

      - name: Prepare Deployment Files
        run: |
          mkdir -p deploy-package
          # Standaloneではなく通常のビルド成果物を使用
          cp -r .next deploy-package/
          cp -r public deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/ 2>/dev/null || true
          cp -r scripts deploy-package/
          cp .env deploy-package/

      - name: Zip Artifact
        run: |
          cd deploy-package
          # node_modulesはサーバー側でインストールするため、zipには含めない
          zip -r ../deploy.zip . -x "node_modules/*"

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Transfer to VM
        run: |
          gcloud compute scp deploy.zip $INSTANCE_NAME:~/ --zone $ZONE --project $PROJECT_ID

      - name: Deploy on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            # 外部スクリプトの解凍と実行 (クォート問題を回避するため)
            # まずスクリプトだけを取り出す (zip内パス: scripts/deploy.sh -> ./scripts/deploy.sh)
            unzip -o deploy.zip scripts/deploy.sh
            chmod +x scripts/deploy.sh
            
            # スクリプト実行
            ./scripts/deploy.sh
          "
