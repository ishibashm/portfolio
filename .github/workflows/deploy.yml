name: Deploy to GCP

on:
  push:
    branches: [ master ] # masterに変更

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    env:
      INSTANCE_NAME: wordpress-1-vm
      ZONE: us-central1-f
      PROJECT_ID: blog-471319

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Prepare Deployment Files
        run: |
          # デプロイ用のディレクトリを作成
          mkdir -p deploy-package
          # 必要なファイルをコピー
          cp -r .next deploy-package/
          cp -r public deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/ 2>/dev/null || true
          cp -r prisma deploy-package/
          # node_modulesは含めない（サーバー側でnpm installを実行するため）
          # 過去の成功パターン: standaloneモードのモジュール解決問題を避けるため、サーバー側でnpm installを実行

      - name: Create .env from Secret
        run: |
          echo "${{ secrets.ENV_FILE }}" > deploy-package/.env

      - name: Zip Artifact
        run: |
          cd deploy-package
          # node_modulesを除外（サーバー側でnpm installを実行するため）
          # 過去の成功パターンに基づく: サーバー側でnpm installを実行することで、モジュール解決の問題を回避
          zip -r ../deploy.zip . -x "node_modules/*" "*.log"

      - name: Auth with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Transfer to VM
        run: |
          gcloud compute scp deploy.zip $INSTANCE_NAME:~/ --zone $ZONE --project $PROJECT_ID

      - name: Deploy on VM
        run: |
          gcloud compute ssh $INSTANCE_NAME --zone $ZONE --project $PROJECT_ID --command "
            set -e  # エラー時に停止
            
            echo '=== デプロイ開始 ==='
            
            # 既存のアプリを停止
            pm2 delete portfolio || true
            echo '既存のプロセスを停止しました'
            
            # 既存のmy-appを削除（新しいバージョンに置き換えるため）
            rm -rf my-app
            echo '古いmy-appフォルダを削除しました'
            
            # my-appフォルダを作成して解凍
            echo 'ZIPファイルを解凍中...'
            mkdir -p my-app
            unzip -o deploy.zip -d my-app
            rm deploy.zip
            echo '解凍完了'
            
            cd my-app
            
            # ファイル構造を確認
            echo 'ファイル構造を確認中...'
            ls -la | head -20
            
            # package.jsonが存在するか確認
            if [ ! -f package.json ]; then
              echo 'エラー: package.jsonが見つかりません'
              exit 1
            fi
            
            # 依存関係のインストールはスキップ（standaloneに含まれるnode_modulesを使用）
            # GitHub Actions (Linux) でビルドしているため、そのまま使えるはず
            echo 'standaloneに含まれるnode_modulesを使用します'
            
            # アプリを起動
            echo 'アプリを起動中...'
            HOSTNAME=0.0.0.0 PORT=3000 pm2 start server.js --name "portfolio" --update-env
            pm2 save
            echo 'アプリ起動完了'
            
            # ステータス確認
            sleep 2
            pm2 status
            pm2 logs portfolio --lines 20 --nostream || true
            
            echo '=== デプロイ完了 ==='
          "
