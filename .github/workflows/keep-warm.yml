name: Keep the Cloud Run instance warm

# min-instances=0 の構成では、しばらく誰も来ないとインスタンスが降りて、
# 次の 1 人（や Googlebot）が Node の起動を丸ごと待つ。クローラーが
# この待ちでタイムアウトし、クロールエラーになっている疑いがある。
#
# min-instances=1 にすれば消える問題だが、常時起動ぶんの課金が発生する。
# 代わりに、冷え切る前に軽い ping を送って温め続ける。
#
# Cloud Scheduler ではなく Actions の cron を使うのは、
#   - 公開リポジトリの Actions は無料で、GCP 側にリソースを増やさない
#   - リポジトリの中で完結し、後から差分で追える
# ため。Actions の cron は混雑時に数分〜十数分遅れることがあるが、
# ウォームアップ用途では致命的ではない（遅れた分だけ冷える確率が上がるだけ）。
#
# 叩き先の /api/health は何も import せず DB にも触らない
# （src/app/api/health/route.ts）。Cloud Run の課金はリクエスト処理中の
# CPU 秒なので、この ping のコストはほぼゼロで、無料枠（月 200 万
# リクエスト）も圧迫しない。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping /api/health
        run: |
          set -uo pipefail
          # TTFB を残す。冷えていたときは数秒、温かければ数十 ms になる
          # はずで、コールドスタート対策が効いているかをここで読める。
          OUT=$(curl -s -o /dev/null \
                  -w "%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s" \
                  --max-time 60 "https://cloud-palette.com/api/health" || echo "000")
          echo "1回目: $OUT"
          CODE="${OUT%% *}"

          if [ "$CODE" = "200" ]; then
            exit 0
          fi

          # 404 はエンドポイントがまだデプロイされていないだけで、
          # リクエストがコンテナに届いた時点で温めの目的は果たしている。
          if [ "$CODE" = "404" ]; then
            echo "::notice::/api/health が 404。デプロイ待ちとみなす（温め自体は成立）。"
            exit 0
          fi

          # 応答なし・5xx は一度だけやり直す。それでもだめなら落として
          # 「サイトが返事をしていない」ことに気付けるようにする。
          sleep 30
          OUT2=$(curl -s -o /dev/null \
                   -w "%{http_code} ttfb=%{time_starttransfer}s total=%{time_total}s" \
                   --max-time 60 "https://cloud-palette.com/api/health" || echo "000")
          echo "2回目: $OUT2"
          CODE2="${OUT2%% *}"
          [ "$CODE2" = "200" ] && exit 0

          echo "::error::サイトが応答していない (1回目 $CODE / 2回目 $CODE2)"
          exit 1
