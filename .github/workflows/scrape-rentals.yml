name: Refresh Rental Listings (Nifty)

# Real Estate Arbitrage Scanner が参照する rental_properties を定期的に更新する。
# 手元の run_scraper.bat を回さない限りデータが古いままになっていたため、
# スクレイピングとジオコーディングを CI 側で自動実行する。
#
# 対象は移住候補の 12 県。1 県 = 1 ジョブの matrix にしてあるのは、
# 直列だと 1 巡に 2 週間かかり「表示されるデータが常に古い」という
# 元の問題に戻ってしまうため。並列数は相手サーバーへの負荷を考えて 3 に抑えている
# （各ジョブが 2〜4 秒の待機を挟むので、合計でおよそ毎秒 1 リクエスト）。
#
# 1 回の実行では全域を走り切らない前提で、各県の再開位置を actions/cache に保存し、
# 次回の実行が続きから再開する。その県を回り切るとステートが消えて全件リフレッシュに戻る。

on:
  schedule:
    # 毎日 19:00 UTC = 翌 04:00 JST
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      prefectures:
        description: "対象都道府県（カンマ区切り、空なら既定の12県すべて）"
        required: false
        default: ""
      scraper_budget_min:
        description: "1県あたりに割く分数"
        required: false
        default: "100"
      reset_state:
        description: "再開位置を破棄して最初からやり直す"
        type: boolean
        required: false
        default: false

# スクレイプ中に次の実行が始まると同じ URL を二重 upsert しに行くので直列化する。
concurrency:
  group: rental-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # 1 県が落ちても他県の取り込みは続けたい。
      fail-fast: false
      max-parallel: 3
      matrix:
        prefecture:
          - aichi
          - shizuoka
          - mie
          - fukui
          - shiga
          - kyoto
          - osaka
          - nara
          - hyogo
          - tottori
          - shimane
          - hiroshima

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env

      - name: Generate Prisma Client
        run: npx prisma generate

      # 再開位置は .gitignore 済みなので、実行間の引き継ぎはキャッシュで行う。
      # 並列ジョブが互いの位置を潰さないよう、キーもファイル名も県ごとに分ける。
      - name: Restore resume state for ${{ matrix.prefecture }}
        uses: actions/cache@v4
        with:
          path: scripts/scraper_state_${{ matrix.prefecture }}.json
          key: nifty-scraper-state-${{ matrix.prefecture }}-${{ github.run_id }}
          restore-keys: |
            nifty-scraper-state-${{ matrix.prefecture }}-

      - name: Reset resume state
        if: ${{ inputs.reset_state == true }}
        run: rm -f scripts/scraper_state_${{ matrix.prefecture }}.json

      - name: Scrape ${{ matrix.prefecture }}
        # 手動実行で prefectures を指定した場合、その中に無い県はスキップする。
        if: ${{ inputs.prefectures == '' || contains(format(',{0},', inputs.prefectures), format(',{0},', matrix.prefecture)) }}
        env:
          SCRAPER_PREFECTURES: ${{ matrix.prefecture }}
          SCRAPER_STATE_FILE: scripts/scraper_state_${{ matrix.prefecture }}.json
          SCRAPER_TIME_BUDGET_MIN: ${{ inputs.scraper_budget_min || '100' }}
        run: npx -y tsx scripts/nifty_extractor.ts

  geocode:
    # 新規に取り込んだ行は lat/lon が NULL のままで、
    # /api/rentals/arbitrage は座標のある物件しか返さない。
    # ここまでやらないとスキャナーの表示は 1 件も増えない。
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # 最後にエリア相場の JSON をコミットして押し戻すため
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Geocode newly imported properties
        env:
          GEOCODE_TIME_BUDGET_MIN: "60"
        run: npx -y tsx scripts/geocode_properties.ts

      # level を見ずに座標を採用していた時期に、市の代表点を割り当てられた物件が
      # 大量に残っている（同一座標に数千件が固まっている）。方位計算がその市の
      # 全物件で同じになってしまうため、国土地理院の住所検索で引き直す。
      # 対象が無くなれば即座に終わるので、解消後は無害な no-op になる。
      - name: Re-geocode properties stuck on a city centroid
        env:
          GEOCODE_REFRESH_CLUSTERED: "true"
          GEOCODE_TIME_BUDGET_MIN: "60"
        run: npx -y tsx scripts/geocode_properties.ts

      # スクレイパーは upsert しかしないので、掲載終了した物件も行として残り続ける。
      # Supabase Free は 500MB でリードオンリーに落ちるため、
      # 対象外の県と長期間確認できていない行をここで落として増加を頭打ちにする。
      #
      # 保持期間は実測で決めている。last_seen_at の分布は
      #   24時間以内 222,852 行 / 45〜90日 141,996 行 / その間 0 行
      # と二極化しており、スイープが触る行は必ず 1 日以内に触られる。
      # 45 日を超えて残っているものは再訪されていない＝掲載終了とみなせる。
      # スキャナー側も maxSeenDays=30 で切っているので、表示には影響しない。
      - name: Purge out-of-scope and dead listings
        env:
          PURGE_APPLY: "true"
          PURGE_STALE_DAYS: "45"
        run: npx -y tsx scripts/purge_rental_properties.ts

      - name: Report freshness
        run: npx -y tsx scripts/report_rental_freshness.ts

      # /houi/area/* は src/data/areaDirections.json を静的生成の入力にしている。
      # 手で作り直す運用だと相場が古いまま残り、記事の数字が実態とずれる。
      # パージまで終わった後の状態で集計し、変化があればコミットして
      # デプロイまで流す（deploy.yml が master への push で動く）。
      - name: Rebuild area dataset
        run: npx -y tsx scripts/build_area_dataset.ts

      - name: Commit area dataset if changed
        run: |
          if git diff --quiet -- src/data/areaDirections.json; then
            echo "エリア相場に変化なし。コミットしない。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/areaDirections.json
          git commit -m "chore(data): エリア別の家賃相場を更新する [skip ci]"
          # 実行中に master が進んでいることがあるので、取り込んでから押す
          git pull --rebase origin master
          git push origin HEAD:master
