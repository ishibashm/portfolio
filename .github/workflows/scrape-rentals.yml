name: Refresh Rental Listings (Nifty)

# Real Estate Arbitrage Scanner が参照する rental_properties を定期的に更新する。
# 手元の run_scraper.bat を回さない限りデータが古いままになっていたため、
# スクレイピングとジオコーディングを CI 側で自動実行する。
#
# 1 回の実行では全域を走り切らない前提で、scripts/scraper_state.json を
# actions/cache に保存し、次回の実行が続きから再開する。
# 全域を回り切るとスクリプトがステートを消すので、そこから全件リフレッシュが始まる。

on:
  schedule:
    # 毎日 19:00 UTC = 翌 04:00 JST
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      scraper_budget_min:
        description: "スクレイピングに割く分数"
        required: false
        default: "180"
      reset_state:
        description: "再開位置を破棄して最初からやり直す"
        type: boolean
        required: false
        default: false

# スクレイプ中に次の実行が始まると同じ URL を二重 upsert しに行くので直列化する。
concurrency:
  group: rental-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env

      - name: Generate Prisma Client
        run: npx prisma generate

      # scraper_state.json は .gitignore 済みなので、実行間の引き継ぎはキャッシュで行う。
      # restore-keys でひとつ前の実行の値を拾い、post ステップで新しいキーとして保存する。
      - name: Restore scraper resume state
        uses: actions/cache@v4
        with:
          path: scripts/scraper_state.json
          key: nifty-scraper-state-${{ github.run_id }}
          restore-keys: |
            nifty-scraper-state-

      - name: Reset resume state
        if: ${{ inputs.reset_state == true }}
        run: rm -f scripts/scraper_state.json

      - name: Scrape rental listings
        env:
          SCRAPER_TIME_BUDGET_MIN: ${{ inputs.scraper_budget_min || '180' }}
        run: npx -y tsx scripts/nifty_extractor.ts

      # 新規に取り込んだ行は lat/lon が NULL のままで、
      # /api/rentals/arbitrage は座標のある物件しか返さない。
      # ここでジオコーディングまでやらないとスキャナーには何も増えない。
      - name: Geocode newly imported properties
        env:
          GEOCODE_TIME_BUDGET_MIN: "60"
        run: npx -y tsx scripts/geocode_properties.ts

      - name: Report freshness
        run: npx -y tsx scripts/report_rental_freshness.ts
