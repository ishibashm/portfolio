name: Refresh Rental Listings (Nifty)

# Real Estate Arbitrage Scanner が参照する rental_properties を定期的に更新する。
# 手元の run_scraper.bat を回さない限りデータが古いままになっていたため、
# スクレイピングとジオコーディングを CI 側で自動実行する。
#
# 対象県・1 県あたりの分数・巡回間隔・並列数は src/lib/scrapeTargets.ts が持つ。
# ここに県名を直書きしない。同じリストがパージ側とずれると、取り込んだ行を
# その晩に「範囲外」として削除してしまう（岐阜が実際にそうなった）。
#
# 1 県 = 1 ジョブの matrix にしてあるのは、直列だと 1 巡に 2 週間かかり
# 「表示されるデータが常に古い」という元の問題に戻ってしまうため。
#
# 相手サーバーへのリクエスト頻度は max-parallel だけで決まる。各ジョブが
# ページごとに 2〜4 秒待つので、およそ 並列数 / 3 秒。県を何県足しても、
# 並列数を変えなければ負荷は増えない。増えるのは 1 回の実行にかかる実時間で、
# これが 24 時間を超えると日次の cron を追い越して巡回が飛ぶ。そのため
# 在庫の多い県は毎日、少ない県は数日に 1 回に間引いている。どの県をその日に
# 回すかは plan ジョブが決める。
#
# 1 回の実行では全域を走り切らない前提で、各県の再開位置を actions/cache に保存し、
# 次回の実行が続きから再開する。その県を回り切るとステートが消えて全件リフレッシュに戻る。

on:
  schedule:
    # 毎日 19:00 UTC = 翌 04:00 JST
    # 毎時 0 分は GitHub の schedule が最も混む時刻で、実測で 3.4 時間
    # 遅延した（2026-08-27 の 19:00Z 予定が 8/28 02:22Z 発火。遅れたぶん
    # 翌日の cron と近接し、直列化の待ちが延びる）。混まない分にずらす。
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      prefectures:
        description: "対象都道府県（カンマ区切り、空ならその日の巡回予定どおり）"
        required: false
        default: ""
      scraper_budget_min:
        description: "1県あたりに割く分数。空ならレジストリの県ごとの値を使う"
        required: false
        default: ""
      reset_state:
        description: "再開位置を破棄して最初からやり直す"
        type: boolean
        required: false
        default: false
      dedupe:
        description: "同じ部屋の重複行をまとめる。apply は実際に削除する（定期実行は常に apply）"
        type: choice
        required: false
        options:
          - dry-run
          - apply
          - "off"
        default: dry-run
      dedupe_key:
        description: "重複とみなす鍵（a=建物名のみ / b=+エリア / c=+住所）"
        required: false
        default: "c"

# スクレイプ中に次の実行が始まると同じ URL を二重 upsert しに行くので直列化する。
#
# グループ名は db-capacity.yml / db-index.yml と共有する。この中の purge と
# dedupe が VACUUM FULL を打ち、テーブル全体に ACCESS EXCLUSIVE を取るため、
# 他の DB 作業と重ねられない。
concurrency:
  group: rental-properties-write
  cancel-in-progress: false

jobs:
  # その日に回す県と分数を決める。npm ci を挟まないので 20 秒ほどで終わる
  # （scrapeTargets.ts と plan_scrape_matrix.ts は依存を持たない）。
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      max_parallel: ${{ steps.plan.outputs.max_parallel }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Plan today's targets
        id: plan
        env:
          PLAN_PREFECTURES: ${{ inputs.prefectures }}
          PLAN_BUDGET_MIN: ${{ inputs.scraper_budget_min }}
        # 定時起動では「cron が指した日」で計画する。GitHub の混雑で run の
        # 起動が数時間遅れることがあり（実測: 8/28 19:17 の cron が 8/29
        # 02:09 起動）、起動時刻の日付で計画すると UTC の日付をまたいだ
        # 瞬間に別の日の予定になる。3 日周期の県はその日の巡回機会を丸ごと
        # 失う（長崎が 16 日間触られなかった一因）。cron は 19:17 UTC
        # なので、now - 12 時間 の日付は、定刻なら同日 07:17、遅延が
        # 16 時間 43 分までなら同日のまま。手動実行は今までどおり現在時刻
        # （その場で回したいのだから、ずらす理由が無い）。
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PLAN_DATE=$(date -u -d '12 hours ago' +%F)
            export PLAN_DATE
            echo "定時起動: 計画日付を $PLAN_DATE に固定する（cron 19:17 UTC の遅延対策）"
          fi
          npx -y tsx scripts/plan_scrape_matrix.ts

  scrape:
    needs: plan
    # 巡回予定がその日 0 件になることは通常ないが、手動実行で存在しない県だけを
    # 指定した場合などに空になる。空の matrix はワークフロー全体を落とすので弾く。
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-latest
    # 最長ジョブ（東京の 300 分）を打ち切らない値にする。レジストリで
    # budgetMin を増やすときはここも見直すこと。
    timeout-minutes: 360
    strategy:
      # 1 県が落ちても他県の取り込みは続けたい。
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        # **上限と再試行を置く。**この 1 行が apt の待ちで固まり、ジョブの
        # 持ち時間 6 時間を丸ごと溶かした実績がある（2026-08-19 の大阪。
        # run 32292215100 / job 96195720004）。ログは apt の途中で 5 時間 58 分
        # 沈黙し、打ち切り時に残っていたのが
        # `npm exec playwright install --with-deps chromium` だった。
        # 肝心の取り込みは step ごと skipped で、**1 件も取れていない。**
        #
        # 実測は 2 分（同じ run の東京）。8 分で切って 3 回やり直す。
        # ここで落ちてもその県が 1 つ落ちるだけで、他県は続く。
        # 何より、固まったジョブが concurrency グループを 6 時間
        # 抱えたままにならない（DDL の適用がそれで止まった）。
        timeout-minutes: 30
        run: |
          for i in 1 2 3; do
            if timeout 8m npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install が 8 分で終わらなかった（${i} 回目）。やり直す。"
          done
          echo "::error::playwright install が 3 回とも失敗した。"
          exit 1

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh

      - name: Generate Prisma Client
        run: npx prisma generate

      # 再開位置は .gitignore 済みなので、実行間の引き継ぎはキャッシュで行う。
      # 並列ジョブが互いの位置を潰さないよう、キーもファイル名も県ごとに分ける。
      - name: Restore resume state for ${{ matrix.prefecture }}
        uses: actions/cache@v4
        with:
          path: scripts/scraper_state_${{ matrix.prefecture }}.json
          key: nifty-scraper-state-${{ matrix.prefecture }}-${{ github.run_id }}
          restore-keys: |
            nifty-scraper-state-${{ matrix.prefecture }}-

      - name: Reset resume state
        if: ${{ inputs.reset_state == true }}
        run: rm -f scripts/scraper_state_${{ matrix.prefecture }}.json

      # 対象の絞り込みは plan ジョブが済ませているので、ここに if は要らない。
      # 以前は全県ぶんのジョブを起動してから中で skip していたため、手動実行でも
      # 12 ジョブぶんのセットアップが毎回走っていた。
      - name: Scrape ${{ matrix.prefecture }} (${{ matrix.budget }} min)
        env:
          SCRAPER_PREFECTURES: ${{ matrix.prefecture }}
          SCRAPER_STATE_FILE: scripts/scraper_state_${{ matrix.prefecture }}.json
          SCRAPER_TIME_BUDGET_MIN: ${{ matrix.budget }}
        run: npx -y tsx scripts/nifty_extractor.ts

  geocode:
    # 新規に取り込んだ行は lat/lon が NULL のままで、
    # /api/rentals/arbitrage は座標のある物件しか返さない。
    # ここまでやらないとスキャナーの表示は 1 件も増えない。
    needs: scrape
    if: always()
    runs-on: ubuntu-latest
    # ジオコーディングに 60+60 分を積んだ状態で 120 分にしていたため、
    # 2 本目の途中で必ずジョブごと打ち切られ、後続のパージ・レポート・
    # エリア相場の再生成が毎日スキップされていた。実測で 8/6 の実行が
    # まさにこれで、容量の安全弁が一度も動いていない。
    # 公開リポジトリで Actions の従量課金は無いので、詰めずに枠を広げる。
    #
    # 首都圏 4 県を対象に足したぶん、ジオコーディングとエリア相場の再生成が
    # 扱う町丁目の数が増える。180 分のままだと同じ打ち切りを繰り返すので広げる。
    timeout-minutes: 300
    # 最後にエリア相場の JSON をコミットして押し戻すため
    permissions:
      contents: write

    steps:
      # デプロイキー（SSH）で checkout する。
      #
      # 既定の GITHUB_TOKEN が押したコミットはワークフローを起動しない。
      # そのままだと下のデータコミットが deploy.yml を動かせず、県別の
      # 色分けもエリア相場も本番に出ないまま残る（静的 JSON をビルドに
      # 焼き込む方式のため）。実際 ded71b7 / 6df3e83 のデータコミットでは
      # デプロイが走っていない。
      #
      # PAT ではなくデプロイキーにしてあるのは有効期限のため。PAT は最長
      # 366 日で切れ、切れるとこの checkout がその場で失敗して、パージも
      # 重複排除もジオコーディングもエリア相場の再生成も丸ごと飛ぶ。
      # デプロイキーは無期限で、このリポジトリ 1 つにしか効かない。
      #
      # 鍵の作り方（秘密鍵は手元で作ってリポジトリへは絶対に置かない）:
      #   ssh-keygen -t ed25519 -N "" -C "portfolio data push" -f data_push_key
      #   公開鍵 data_push_key.pub → Settings > Deploy keys
      #                              「Allow write access」にチェックして登録
      #   秘密鍵 data_push_key     → Settings > Secrets > Actions
      #                              DATA_PUSH_KEY として登録
      #
      # 未設定なら GITHUB_TOKEN に落ちる。push 自体は通るのでパイプラインは
      # 壊れず、デプロイだけが次の push 待ちになる。
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DATA_PUSH_KEY }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Create .env from Secret
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
          DATABASE_URL_OVERRIDE: ${{ secrets.DATABASE_URL_OVERRIDE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "::error::secrets.ENV_FILE is empty. DATABASE_URL / DIRECT_URL are required."
            exit 1
          fi
          echo "$ENV_FILE_CONTENT" > .env
          bash scripts/apply-db-override.sh

      - name: Generate Prisma Client
        run: npx prisma generate

      # 容量の安全弁は最初に置く。ジオコーディングは時間予算で打ち切られる
      # 前提の best-effort な処理なので、その後ろに置くと巻き込まれて動かない。
      # 先に消しておけば、ジオコーディングが引く母数もその分減る。
      #
      # スクレイパーは upsert しかしないので、掲載終了した物件も行として残り続ける。
      # 対象外の県と長期間確認できていない行をここで落として増加を頭打ちにする。
      # Supabase Free の 500MB を割るために入れた処理だが、移行後も要る。
      # 掲載終了した物件が検索結果に出続けるのは、容量とは別の問題として困る。
      #
      # 保持期間は実測で決めている。last_seen_at の分布は
      #   24時間以内 222,852 行 / 45〜90日 141,996 行 / その間 0 行
      # と二極化しており、スイープが触る行は必ず 1 日以内に触られる。
      # 45 日を超えて残っているものは再訪されていない＝掲載終了とみなせる。
      # スキャナー側も maxSeenDays=30 で切っているので、表示には影響しない。
      - name: Purge out-of-scope and dead listings
        env:
          PURGE_APPLY: "true"
          PURGE_STALE_DAYS: "45"
        run: npx -y tsx scripts/purge_rental_properties.ts

      # ジオコーディングより前に置く。同じ部屋の重複を先に落としておかないと、
      # 消す予定の行に対して住所検索を投げることになる。
      # 既定はドライラン。定期実行では件数を報告するだけで、消さない。
      # 定期実行では実際に削除する。スクレイパーが毎日 upsert する以上、
      # 重複は放っておけば必ず積み上がる。一度きりの掃除では戻ってしまう。
      # 手で起動したときは既定をドライランのままにして、様子を見られるようにする。
      - name: Collapse duplicate listings of the same room
        if: ${{ inputs.dedupe != 'off' }}
        env:
          DEDUPE_APPLY: ${{ inputs.dedupe == 'apply' || github.event_name == 'schedule' }}
          # 既定は c。建物名だけを鍵にすると市が違えば別物の建物まで同一視する。
          # 実測では c と b の削減率の差は 1% しかなく、安全側に倒す代償が無い。
          DEDUPE_KEY: ${{ inputs.dedupe_key || 'c' }}
        run: npx -y tsx scripts/dedupe_rental_properties.ts

      # 座標が付くまで、その物件は検索にもスキャナーにも出ない。47 県へ
      # 広げたぶん、初回は町丁目の名寄せが大量に発生する（8/8 の実行では
      # キャッシュ済み 15,669 町で GSI 問い合わせは 13 件しか要らなかったが、
      # 新しい県ぶんはそのキャッシュがまるごと無い）。ここが律速なので、
      # ジョブの timeout 300 分に対して余っていた枠を回す。
      - name: Geocode newly imported properties
        env:
          GEOCODE_TIME_BUDGET_MIN: "150"
        run: npx -y tsx scripts/geocode_properties.ts

      # level を見ずに座標を採用していた時期に、市の代表点を割り当てられた物件が
      # 大量に残っている（同一座標に数千件が固まっている）。方位計算がその市の
      # 全物件で同じになってしまうため、国土地理院の住所検索で引き直す。
      # 対象が無くなれば即座に終わるので、解消後は無害な no-op になる。
      - name: Re-geocode properties stuck on a city centroid
        env:
          GEOCODE_REFRESH_CLUSTERED: "true"
          GEOCODE_TIME_BUDGET_MIN: "60"
        run: npx -y tsx scripts/geocode_properties.ts

      # 容量の逼迫はこのレポートでしか見えない。ジオコーディングが時間切れに
      # なった日ほど状況を知りたいので、前段が転んでも必ず出す。
      #
      # 上限の 5GB はディスクの残量（92GB）ではなく、異常な増え方に気付くための
      # 目安。現在 233MB なので通常は鳴らず、47都道府県へ広げても 1GB 程度。
      # 4GB に達したら重複排除かパージが壊れている、と読める値にしてある。
      - name: Report freshness
        if: always()
        env:
          DB_SIZE_LIMIT_MB: "5120"
        run: npx -y tsx scripts/report_rental_freshness.ts

      # /houi/area/* は src/data/areaDirections.json を静的生成の入力にしている。
      # 手で作り直す運用だと相場が古いまま残り、記事の数字が実態とずれる。
      # パージまで終わった後の状態で集計し、変化があればコミットして
      # デプロイまで流す（deploy.yml が master への push で動く）。
      - name: Rebuild area dataset
        run: npx -y tsx scripts/build_area_dataset.ts

      # /relocation/market の計量分析（ヘドニック回帰・分布・生存分析）。
      # エリア相場と同じく静的 JSON に焼き、訪問時には DB を叩かない。
      # ここが転んでもエリア相場のコミットを道連れにしないよう続行する。
      # 失敗したら marketStats.json が更新されないだけで、ページは
      # 前回ぶん（初回なら準備中表示）のまま。
      - name: Rebuild market stats
        id: market_stats
        continue-on-error: true
        run: npx -y tsx scripts/build_market_stats.ts

      # continue-on-error は「エリア相場のコミットを道連れにしない」ために
      # 付けている。ただしそれだけだとジョブが success のままになり、
      # **落ちていることが誰にも見えない。**実際 2026-08-13 から 11 日間、
      # 大阪府でスタックが溢れて毎晩落ちていたのに気付けなかった
      # （marketStats.json が 11 日間そのまま。画面は古い数字を出していた）。
      # 続行はそのままに、落ちたことだけは残す。
      - name: Warn if market stats failed
        if: steps.market_stats.outcome == 'failure'
        run: |
          echo "::warning::Rebuild market stats が失敗した。marketStats.json は前回のまま。相場の画面は古い数字を出す。"
          echo "⚠️ Rebuild market stats が失敗した。marketStats.json は更新されていない。" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit area dataset if changed
        run: |
          # prefecturesWithData.json はスキャナーの県プリセットの元になる。
          # 取り込みが進んで新しい県のページが立つと、ここが増えて初めて
          # UI にその県が出る。押し戻し忘れると永久に出ないので一緒に見る。
          if git diff --quiet -- src/data/areaDirections.json src/data/prefecturesWithData.json src/data/marketStats.json; then
            echo "エリア相場に変化なし。コミットしない。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # [skip ci] を付けない。この push で動かしたいのが deploy.yml
          # そのものだからで、付けると唯一の対象を自分で消すことになる。
          # push で動くワークフローは deploy.yml だけなので、余計な実行は
          # 増えない（deploy.yml は push しないので再帰もしない）。
          #
          # 実行中に master が進んでいることがあるので、取り込んでから押す。
          # **rebase では取り込めない。**この 3 つは毎晩まるごと作り直す
          # 生成物なので、master 側にも別の生成コミットが載っていると
          # 必ず内容衝突する。実際 2026-08-28 の run はここで
          # 「CONFLICT (content): src/data/areaDirections.json」で止まり、
          # 一晩ぶんの収集結果が本番に届かなかった。
          #
          # 生成物に「両方を混ぜた正解」は無い。今この run が作り直した
          # ものが最新なので、master 側の同ファイルは捨ててよい。
          # origin/master に合わせ直してから作り直した中身を載せる。
          for attempt in 1 2 3; do
            git fetch origin master
            # reset --hard の前に退避する。npm ci などが書き換えた
            # 追跡下のファイルごと戻すので、生成物も巻き添えになる。
            mkdir -p /tmp/area-dataset
            cp src/data/areaDirections.json src/data/prefecturesWithData.json \
               src/data/marketStats.json /tmp/area-dataset/
            git reset --hard origin/master
            cp /tmp/area-dataset/areaDirections.json \
               /tmp/area-dataset/prefecturesWithData.json \
               /tmp/area-dataset/marketStats.json src/data/
            if git diff --quiet -- src/data/areaDirections.json \
                 src/data/prefecturesWithData.json src/data/marketStats.json; then
              echo "master 側が既に同じ内容だった。押すものが無い。"
              exit 0
            fi
            git add src/data/areaDirections.json src/data/prefecturesWithData.json \
                    src/data/marketStats.json
            git commit -m "chore(data): エリア別の家賃相場を更新する"
            if git push origin HEAD:master; then
              break
            fi
            # 押す直前に master が進んだ場合だけここに来る。作り直しては
            # いないので、同じ中身をもう一度 origin/master の上に載せ直す。
            echo "::warning::push が弾かれた（$attempt 回目）。origin/master を取り直して押し直す。"
            if [ "$attempt" = "3" ]; then
              echo "::error::3 回とも push が弾かれた。エリア相場は本番に届いていない。"
              exit 1
            fi
          done

          # デプロイまで届いたかは、この push が何の資格情報で行われたかで
          # 決まる。判断材料をサマリーに残す。
          if [ -n "${{ secrets.DATA_PUSH_KEY }}" ]; then
            echo "データを master へ push した。deploy.yml が続けて動く。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::DATA_PUSH_KEY が未設定。GITHUB_TOKEN で push したため deploy.yml は起動しない。次に master へ push されるまで本番のデータは古いまま。"
            echo "データを master へ push した。ただし DATA_PUSH_KEY が無いためデプロイは走っていない。" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ここまでで新しいデータは master に入り、deploy.yml が本番へ出す。
      # **そのデータで検査が通るかは、まだ誰も見ていない。**
      #
      # 2026-09-01 に実際に起きた。巡回で掲載の分布が変わると
      # areaDirections.json の代表点（掲載物件の緯度経度の平均）が動き、
      # 方位の区分をまたぐことがある。手で書いた市区町村ページの文章が
      # 3 か所ずれ、頁の一覧と食い違ったまま本番に出た。
      #
      #     長岡市 → 小千谷市: 文章=南西  頁の一覧=南
      #
      # ci.yml は master への push でも走るので**赤にはなっていた**が、
      # deploy.yml とは独立していて誰も止めない。気付いたのは偶然で、
      # その間 1 時間ほど食い違ったまま公開されていた。
      #
      # ## 押すのを止めない
      #
      # 検査を push の前に置いて止める案も考えたが、採らない。壊れるのは
      # **データではなく、それを読む側の文章**で、止めると相場が一晩ぶん
      # 古いままになる。相場が古いほうが利用者には害が大きい。
      #
      # **押したうえで、赤くする。**この run が赤くなれば GitHub の通知が
      # 飛び、翌朝の監査で拾える。
      #
      # 検査の一覧はここに書かない。データを読むテストは 16 ファイルあり、
      # 書き写すとその一覧のほうが古くなる（このリポジトリで何度も起きた
      # 型）。全部回す。geocode は既に 1 時間以上かかっており、2〜3 分の
      # 追加は問題にならない。
      - name: Verify the pushed dataset against the test suite
        id: verify_data
        continue-on-error: true
        run: npx vitest run

      - name: Report if the pushed dataset broke the suite
        if: steps.verify_data.outcome == 'failure'
        run: |
          {
            echo "## 新しいデータで検査が落ちた"
            echo
            echo "**データは既に master に入り、本番に出ている。**壊れたのは"
            echo "それを読む側（市区町村ページの文章など）で、データではない。"
            echo
            echo "巡回で代表点が動いて、手書きの文章の方位が実測とずれた"
            echo "可能性が高い。上の \`Verify the pushed dataset\` のログで"
            echo "落ちた検査を見て、\`src/lib/areaEditorial.ts\` を直す。"
            echo
            echo "経緯は docs/improvement-backlog.md の 18 節。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::新しいデータで検査が落ちた。文章が実測とずれている可能性が高い。"
          exit 1
