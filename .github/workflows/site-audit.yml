name: Nightly site audit (URL health / SEO / LLMO)

# 本番サイトの健全性を毎晩たしかめる。
#
# 動機: Search Console のカバレッジに 404 が 12 件たまっていた（8/21 時点）。
# GSC は 3〜5 日遅れでしか教えてくれず、気付くのはクロールの後になる。
# sitemap に載せた URL が生きているかは自分で毎晩見るほうが早い。
#
# 見るもの:
#   1. sitemap.xml の全 URL が 200 を返すこと（3xx も NG。sitemap には
#      最終 URL だけを載せる。リダイレクトが混ざると索引が遅れる）
#   2. robots.txt / llms.txt / llms-full.txt / blog/feed.xml が 200
#   3. 中核ページに構造化データ（application/ld+json）が入っていること
#   4. 記事の図が配信されていて、記事の HTML にも出ていること
#      （Discover は 1200px 以上の画像を要求する。図が出ていなければ
#      条件を満たさない。利用者から「画像がどのページも表示されて
#      いない」と報告を受けたのに、この監査は画像を見ていなかった）
#
# 対象は自分のサイトだけ。0.3 秒間隔の直列 HEAD なので負荷は毎晩
# 100 リクエスト強、4 を足して 130 強。外部サイトには一切触らない。

on:
  schedule:
    # 毎時 0 分を避ける。GitHub の schedule は 0 分が最も混み、巡回では
    # 実測で 3.4 時間遅延した（#667 で scrape-rentals を 17 分にずらした）。
    # ここは telemetry.yml とも同じ "0 21" で、二重に混んでいた。
    # 実際、この監査は定時では**一度も発火していない**（8/27 に master へ
    # 載って以降、走ったのは手動実行の 2 件だけ）。
    - cron: "23 21 * * *" # 06:23 JST
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch sitemap and check every URL
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          FAIL=0

          echo "## sitemap の URL 健全性" | tee -a "$GITHUB_STEP_SUMMARY"

          # sitemap index → 子 sitemap → loc の順にたどる
          mapfile -t SITEMAPS < <(curl -sf "$BASE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep '\.xml$' || true)
          if [ "${#SITEMAPS[@]}" -eq 0 ]; then SITEMAPS=("$BASE/sitemap.xml"); fi

          URLS=$(for sm in "${SITEMAPS[@]}"; do
            curl -sf "$sm" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep -v '\.xml$'
          done | sort -u)

          COUNT=$(echo "$URLS" | grep -c . || true)
          echo "sitemap の URL: $COUNT 件" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -lt 50 ]; then
            echo "::error::sitemap の URL が $COUNT 件しかない。生成が壊れている可能性" | tee -a "$GITHUB_STEP_SUMMARY"
            FAIL=1
          fi

          BAD=""
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" -A "cloud-palette-site-audit" "$url")
            if [ "$code" != "200" ]; then
              BAD="$BAD$code $url"$'\n'
            fi
            sleep 0.3
          done <<< "$URLS"

          if [ -n "$BAD" ]; then
            echo "::error::200 以外を返した URL:" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$BAD" | tee -a "$GITHUB_STEP_SUMMARY"
            FAIL=1
          else
            echo "全 URL が 200" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

          echo "FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: Check robots / llms / feed endpoints
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          echo "## 配信ファイル" | tee -a "$GITHUB_STEP_SUMMARY"
          for path in /robots.txt /llms.txt /llms-full.txt /blog/feed.xml /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE$path")
            echo "$code $path" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$code" != "200" ]; then
              echo "::error::$path が $code" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "FAIL=1" >> "$GITHUB_ENV"
            fi
            sleep 0.3
          done
          # llms.txt がテーマの一文を持っているか（生成の空振り検知）。
          # 落ちたときに「何が返っていたか」が無いと調べられないので、
          # 失敗時は応答ヘッダと冒頭を必ずダンプする（初回実行がまさに
          # これで、200 なのに中身が違う、までしか分からなかった）。
          BODY=$(curl -s --compressed "$BASE/llms.txt")
          if ! echo "$BODY" | grep -q "Cloud Palette"; then
            echo "::error::llms.txt にサイト名が無い。生成が壊れている可能性" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "--- llms.txt の応答ヘッダ ---" | tee -a "$GITHUB_STEP_SUMMARY"
            curl -sI "$BASE/llms.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "--- llms.txt の冒頭 800 バイト ---" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "$BODY" | head -c 800 | tee -a "$GITHUB_STEP_SUMMARY"
            echo "" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "FAIL=1" >> "$GITHUB_ENV"
          fi

      - name: Check structured data on core pages
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          echo "## 構造化データ（application/ld+json）" | tee -a "$GITHUB_STEP_SUMMARY"
          for path in / /houi /guide /blog/honmeisatsu-year-board-next-move; do
            n=$(curl -sf "$BASE$path" | grep -c 'application/ld+json' || true)
            echo "$path: $n 個" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$n" -eq 0 ]; then
              echo "::error::$path に JSON-LD が無い" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "FAIL=1" >> "$GITHUB_ENV"
            fi
            sleep 0.3
          done

      # 記事の図（Discover の画像要件）。
      #
      # 利用者から「画像がどのページも表示されていない」と報告を受けた
      # のに、**この監査は画像を一度も見ていなかった**。開発環境から
      # 本番へ出られないので、手元で確かめようとすると毎回 403 になる。
      # 見ていないものは「直った」と言えない。ここで毎朝測る。
      #
      # 記事の一覧は sitemap から引く（このジョブは checkout しない）。
      # 図の有無は記事ごとに違ってよいので、**1 件も無いときだけ**
      # 失敗にする。それは配信そのものが落ちている状態。
      - name: Check article figures are served
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          echo "## 記事の図" | tee -a "$GITHUB_STEP_SUMMARY"

          # 子 sitemap をたどって /blog/<slug> だけを拾う。一覧や feed は除く。
          SLUGS=$(for sm in $(curl -sf "$BASE/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' | grep '\.xml$' || true); do
            curl -sf "$sm" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g'
            sleep 0.3
          done | { grep -o '/blog/[a-z0-9-]*$' || true; } | sed 's|/blog/||' | sort -u)

          TOTAL=$(echo "$SLUGS" | grep -c . || true)
          WITH=0
          MISSING=""
          SAMPLE=""
          for slug in $SLUGS; do
            [ -z "$slug" ] && continue
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/blog/$slug.png")
            if [ "$code" = "200" ]; then
              WITH=$((WITH + 1))
              [ -z "$SAMPLE" ] && SAMPLE="$slug"
            else
              MISSING="$MISSING$slug($code) "
            fi
            sleep 0.3
          done
          echo "図が配信されている記事: $WITH / $TOTAL 件" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$MISSING" ]; then
            echo "図が無い記事: $MISSING" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$TOTAL" -gt 0 ] && [ "$WITH" -eq 0 ]; then
            echo "::error::記事の図が 1 件も配信されていない" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "FAIL=1" >> "$GITHUB_ENV"
          fi

          # 配信されているだけでは足りない。**記事の HTML に img が出て
          # いるか**を 1 件で確かめる（利用者が見えないと言ったのは
          # ここ）。ファイルはあるのに頁に出ていない、を区別する。
          #
          # 見本は**図があると分かっている記事**から採る。一覧の先頭を
          # 使うと、図を用意していない記事が先頭に来た日にここが赤くなる。
          # 図の有無は記事ごとに違ってよい、と上で決めたばかりなので、
          # それで失敗にするのは筋が通らない。
          if [ -n "$SAMPLE" ]; then
            PAGE=$(curl -s --compressed "$BASE/blog/$SAMPLE")
            if echo "$PAGE" | grep -q "/blog/$SAMPLE\.png"; then
              echo "記事の本文に図が出ている（$SAMPLE で確認）" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$SAMPLE の HTML に図が出ていない" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "FAIL=1" >> "$GITHUB_ENV"

              # **落ちたときに「何が返っていたか」が無いと調べられない。**
              # llms.txt の検査は最初からこれをやっているのに、こちらに
              # 写し忘れていた。おかげで 2 回続けて赤くしながら、原因を
              # 推測でしか言えなかった（2026-09-05）。
              #
              # いちばん知りたいのは og:image。記事の図は blogImagePath が
              # **実行時に existsSync でファイルの有無を見て**決めていて、
              # 無ければ /ogp.png に落ちる。og:image も落ちていれば
              # 「本番でファイルが見えていない」、og:image は正しいのに
              # img だけ無いなら「描画側」と切り分けられる。
              echo "--- 応答ヘッダ ---" | tee -a "$GITHUB_STEP_SUMMARY"
              curl -sI "$BASE/blog/$SAMPLE" | head -20 | tee -a "$GITHUB_STEP_SUMMARY"
              echo "--- og:image / twitter:image ---" | tee -a "$GITHUB_STEP_SUMMARY"
              { echo "$PAGE" | grep -o 'og:image" content="[^"]*"' | head -2 || true; } \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "--- 本文に出ている img（先頭 5 件）---" | tee -a "$GITHUB_STEP_SUMMARY"
              { echo "$PAGE" | grep -o '<img[^>]*src="[^"]*"' | head -5 || true; } \
                | tee -a "$GITHUB_STEP_SUMMARY"
              echo "--- 本文の長さ（バイト）---" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "$PAGE" | wc -c | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # /news の配信元。ページは取得できなかった配信元の名前を出すので、
      # それを読んで「どれが死んでいるか」を毎朝つかむ。
      #
      # 台帳（src/data/newsSources.ts）の URL は**本番でしか生存確認
      # できない**（開発環境から外へ出られない）。落ちたフィードは黙って
      # 飛ばす作りなので、見に行かないと気付けない。
      #
      # **落ちていても監査は失敗させない。**配信元の一時的な停止はこちらで
      # 直せるものではなく、赤くすると「赤いのが常態」になる（18 節）。
      # 数だけ出して、続くようなら台帳を直す。
      - name: Check /news feeds
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          echo "## /news の配信元" | tee -a "$GITHUB_STEP_SUMMARY"
          BODY=$(curl -sf --compressed "$BASE/news" || true)
          if [ -z "$BODY" ]; then
            echo "::error::/news を取得できない" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "FAIL=1" >> "$GITHUB_ENV"
          else
            # **id の異なり数**で数える。grep -c は行数なので、HTML が
            # 1 行で来ると常に 1 になる（実際にそうなった）。RSC の
            # ペイロードにも同じ属性が載るので、重複も畳む必要がある。
            #
            # 1 件も無いとき grep は 1 で終わる。`bash -e` と pipefail の
            # 下では、それだけで**このステップが exit 1 で落ちる**。
            # 実際に落ちた（2026-09-04、デプロイ直後）。上のコメントに
            # 「落ちていても監査は失敗させない」と書いてあるのに、
            # 0 件という一番知りたい状態でだけ、理由も出さずに赤くなる。
            # grep の 1 は「無かった」であって失敗ではないので飲む。
            ids() { { echo "$BODY" | grep -o "$1=\"[^\"]*\"" || true; } | sed "s/.*=\"//;s/\"//" | sort -u; }
            ALIVE=$(ids data-feed-source | tr '\n' ' ')
            DOWN=$(ids data-feed-down | tr '\n' ' ')
            N_ALIVE=$(echo $ALIVE | wc -w)
            echo "見出しを出せている: $N_ALIVE 件 — $ALIVE" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ -n "$(echo $DOWN | tr -d ' ')" ]; then
              echo "取得できていない: $(echo $DOWN | wc -w) 件 — $DOWN" | tee -a "$GITHUB_STEP_SUMMARY"
            elif [ "$N_ALIVE" -eq 0 ]; then
              # デプロイ直後はこうなる。ビルド時（CI は外に出られない）に
              # 焼いた静的 HTML が出ていて、まだ再生成されていない状態。
              # 数分で埋まるので、ここも失敗にはしない。
              echo "配信元の印が 1 つも無い。デプロイ直後で再生成前か、取得が全滅している" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "全部の配信元から見出しが出ている" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # その地域のニュース（/api/news/local）。地名で絞る仕組みなので、
      # **本番でしか何件出るか分からない**。0 件が普通の市区町村もあるが、
      # どこも 0 件なら絞り込みが効きすぎているしるしになる。
      #
      # **落ちても監査は失敗させない。**配信元の内容次第で 0 件はありうる。
      # 数だけ出して、続くようなら拾う範囲を見直す。
      - name: Check /api/news/local
        run: |
          set -uo pipefail
          BASE="https://cloud-palette.com"
          echo "## その地域のニュース" | tee -a "$GITHUB_STEP_SUMMARY"
          TOTAL=0
          # 掲載の多い市区町村と、県を 1 つ。UR の入札は本部ごとに地名が
          # 入るので、政令市と県庁所在地では拾えるはず。
          for q in "area=13106" "area=27106" "area=40137" "area=15102" "pref=13"; do
            BODY=$(curl -sf --compressed "$BASE/api/news/local?$q" || true)
            if [ -z "$BODY" ]; then
              echo "$q: 取得できない" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # data 配列の要素数。"title" の数で数える（jq を入れない）。
            # 0 件のとき grep は 1 で終わる。bash -e と pipefail の下では
            # それだけでステップが落ちるので飲む（同じ罠を /news の欄で
            # 一度踏んでいる）。
            N=$({ echo "$BODY" | grep -o '"title"' || true; } | wc -l)
            TOTAL=$((TOTAL + N))
            echo "$q: $N 件" | tee -a "$GITHUB_STEP_SUMMARY"
            sleep 0.3
          done
          if [ "$TOTAL" -eq 0 ]; then
            echo "どこも 0 件。絞り込みが効きすぎているか、配信元に地名が出ていない" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Result
        run: |
          if [ "${FAIL:-0}" = "1" ]; then
            echo "監査に失敗した項目がある。上のサマリを見ること。"
            exit 1
          fi
          echo "すべて通過"
