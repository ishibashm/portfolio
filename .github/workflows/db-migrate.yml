name: Migrate database to a new host

# Supabase Free の 500MB を超えたため、別の PostgreSQL へ移す。
#
# 手元から DB に繋げない環境（5432 が塞がれている等）でも移行できるように、
# ランナー上で pg_dump / pg_restore を回す。接続情報は Secret に置くので、
# 実行者の手元にも、ログにも出ない。
#
# 実行前に次の Secret を用意すること:
#   MIGRATION_SOURCE_URL … 移行元。Supabase の DIRECT_URL（プーラ経由でない方）
#   MIGRATION_TARGET_URL … 移行先。新しい PostgreSQL
#
# 移行元は読むだけ。書き換えない。

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '移行先のデータを上書きします。実行するなら MIGRATE と入力'
        required: true
        default: ""
      mode:
        description: "dry-run: 中身を調べるだけ / migrate: 実際に移す"
        required: true
        type: choice
        options:
          - dry-run
          - migrate
        default: dry-run

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Guard
        if: ${{ inputs.mode == 'migrate' && inputs.confirm != 'MIGRATE' }}
        run: |
          echo "::error::mode=migrate のときは confirm に MIGRATE と入力すること。"
          exit 1

      # ランナー既定の client はサーバより古いことがある。pg_dump は
      # サーバ以上のバージョンでないと落ちるので、PGDG から 17 を入れる。
      - name: Install PostgreSQL client 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          # 17 を入れるだけでは足りない。/usr/bin/pg_dump は Ubuntu の
          # pg_wrapper で、既定クラスタの版を選ぶ。ランナーには PostgreSQL 16
          # サーバが preinstall されているため 16 が選ばれ、17.6 のサーバに対して
          # 「server version mismatch」で落ちる。実体を PATH の先頭に置いて外す。
          # psql は版差に寛容なので、この取り違えは pg_dump でしか表面化しない。
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Inspect both ends
        env:
          SRC: ${{ secrets.MIGRATION_SOURCE_URL }}
          DST: ${{ secrets.MIGRATION_TARGET_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SRC" ] || [ -z "$DST" ]; then
            echo "::error::MIGRATION_SOURCE_URL / MIGRATION_TARGET_URL が未設定。"
            exit 1
          fi

          # サマリーとログの両方に出す。サマリーは画面では読めるが API からは
          # 取れないため、それだけだと実行結果を後から機械的に確認できない。
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          say "## 移行元"
          say "$(psql "$SRC" -At -c "SELECT 'version: ' || version();")"
          say "$(psql "$SRC" -At -c "SELECT 'size: ' || pg_size_pretty(pg_database_size(current_database()));")"
          say "$(psql "$SRC" -At -c "SELECT 'rental_properties: ' || count(*) FROM rental_properties;")"

          say ""
          say "## 移行先"
          say "$(psql "$DST" -At -c "SELECT 'version: ' || version();")"
          say "$(psql "$DST" -At -c "SELECT 'size: ' || pg_size_pretty(pg_database_size(current_database()));")"
          # 空であることを確認する。既存データがあると restore が衝突する
          TABLES=$(psql "$DST" -At -c "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          say "移行先の public スキーマのテーブル数: $TABLES"
          if [ "$TABLES" != "0" ] && [ "${{ inputs.mode }}" = "migrate" ]; then
            echo "::warning::移行先にテーブルが $TABLES 個ある。--clean で上書きされる。"
          fi

          # 拡張が入っているか。無いと restore が必ず失敗する
          say "$(psql "$DST" -At -c "SELECT 'extensions: ' || string_agg(extname, ', ') FROM pg_extension;")"

      - name: Dump
        if: ${{ inputs.mode == 'migrate' }}
        env:
          SRC: ${{ secrets.MIGRATION_SOURCE_URL }}
        run: |
          set -euo pipefail
          # 使う pg_dump がサーバ以上の版であることを先に確かめる。満たさないと
          # 「server version mismatch」で必ず落ちるので、dump を試みる前に止める。
          echo "pg_dump: $(pg_dump --version)"
          SRV=$(psql "$SRC" -At -c "SHOW server_version;" | cut -d. -f1)
          CLI=$(pg_dump --version | sed -E 's/.* ([0-9]+).*/\1/')
          echo "server major: $SRV / pg_dump major: $CLI"
          if [ "$CLI" -lt "$SRV" ]; then
            echo "::error::pg_dump が $CLI でサーバ $SRV より古い。PATH を確認すること。"
            exit 1
          fi

          # 突き合わせの基準を dump の直前に取る。移行先と「現在の移行元」を
          # 比べると、スクレイパーが動いている間は必ず食い違う。実際に
          # rental_properties が 1,153 行ずれ、データ欠損と区別できなかった。
          # 測りたいのは restore の忠実さであって、経過時間ではない。
          for T in rental_properties user_configs MunicipalityWealth AgentTheme RelocationSimulation; do
            N=$(psql "$SRC" -At -c "SELECT count(*) FROM \"$T\";" 2>/dev/null || echo "-")
            echo "$T $N" >> src_counts.txt
          done
          echo "--- dump 直前の移行元の件数 ---"
          cat src_counts.txt

          # --no-owner --no-acl: Supabase 固有のロール（supabase_admin 等）は
          # 移行先に存在しない。付けないと restore がエラーだらけになる。
          pg_dump "$SRC" --format=custom --no-owner --no-acl --verbose \
            --file=portfolio.dump 2> dump.log || { tail -50 dump.log; exit 1; }
          ls -lh portfolio.dump

      - name: Restore
        if: ${{ inputs.mode == 'migrate' }}
        env:
          DST: ${{ secrets.MIGRATION_TARGET_URL }}
        run: |
          set -euo pipefail

          # Supabase は拡張を extensions スキーマに入れるため、dump の中では
          # DEFAULT extensions.uuid_generate_v4() のように schema 修飾される。
          # 移行先で uuid-ossp を public に入れていると、この既定値を持つ表
          # （user_configs）の CREATE TABLE が「スキーマ extensions が無い」で
          # 失敗し、表ごと欠ける。実際にそれで user_configs だけが作られなかった。
          # 同じ名前でスキーマを用意し、そこに拡張を置く。
          # CREATE EXTENSION IF NOT EXISTS ... WITH SCHEMA は、既にある場合
          # WITH SCHEMA が黙って無視される。作るのではなく移す必要がある。
          #
          # ここは best-effort にする。拡張の所有者は postgres なので、接続に
          # 使うアプリのロールでは ALTER EXTENSION できないことがある
          # （must be owner of extension）。正しい配置は cloud-init が
          # postgres として作る時点で保証する。ここは、その保証が無い移行先
          # （手で作った DB 等）に対する保険。
          psql "$DST" <<'SQL' || echo "::warning::拡張の配置を変更できなかった。extensions スキーマに uuid-ossp があるか確認すること。"
          CREATE SCHEMA IF NOT EXISTS extensions;
          DO $$
          DECLARE ns text; ext text;
          BEGIN
            FOREACH ext IN ARRAY ARRAY['uuid-ossp','pgcrypto'] LOOP
              SELECT n.nspname INTO ns
                FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace
               WHERE e.extname = ext;
              IF ns IS NULL THEN
                EXECUTE format('CREATE EXTENSION %I WITH SCHEMA extensions', ext);
              ELSIF ns <> 'extensions' THEN
                EXECUTE format('ALTER EXTENSION %I SET SCHEMA extensions', ext);
              END IF;
            END LOOP;
          END $$;
          -- 拡張を extensions へ移したので、修飾なしの uuid_generate_v4() も
          -- 引けるようにしておく。prisma db push が既定値を書くときに要る。
          DO $$ BEGIN
            EXECUTE format('ALTER DATABASE %I SET search_path TO "$user", public, extensions',
                           current_database());
          END $$;
          SQL

          # 配置を確かめてから進む。ここが public のままだと user_configs が
          # 表ごと欠けるが、restore は「エラーを無視する」設計なので気付けず、
          # 突き合わせまで進んで初めて分かる。手戻りが大きいので先に止める。
          NS=$(psql "$DST" -At -c "SELECT n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid=e.extnamespace WHERE e.extname='uuid-ossp';")
          echo "uuid-ossp の置き場所: ${NS:-（未インストール）}"
          if [ "$NS" != "extensions" ]; then
            echo "::error::uuid-ossp が extensions スキーマに無い（現在: ${NS:-なし}）。"
            echo "::error::移行先で postgres として次を実行すること:"
            echo "::error::  CREATE SCHEMA IF NOT EXISTS extensions;"
            echo "::error::  ALTER EXTENSION \"uuid-ossp\" SET SCHEMA extensions;"
            exit 1
          fi

          # --clean --if-exists: 再実行できるようにする。途中で失敗しても
          # 作り直しから始められる。
          # エラーで即座に止めない（Supabase 固有のイベントトリガなど、
          # 移行先では不要なものが必ず失敗する）が、件数の突き合わせで判定する。
          pg_restore --dbname="$DST" --no-owner --no-acl \
            --clean --if-exists --jobs=4 --verbose \
            portfolio.dump 2> restore.log || true

          # 移行先で不要な Supabase の配管（superuser 必須のイベントトリガ、
          # PG17 の transaction_timeout）は除いて、実害のあるエラーだけ出す。
          # 全体の末尾だけ見ていたため、user_configs の失敗を取り逃していた。
          echo "--- 実害のあるエラー ---"
          grep -E '^pg_restore: error' restore.log \
            | grep -viE 'event trigger|transaction_timeout|must be superuser' \
            | head -40 || echo "（なし）"
          echo "--- エラー総数 ---"
          grep -c '^pg_restore: error' restore.log || true

      - name: Verify
        if: ${{ inputs.mode == 'migrate' }}
        env:
          SRC: ${{ secrets.MIGRATION_SOURCE_URL }}
          DST: ${{ secrets.MIGRATION_TARGET_URL }}
        run: |
          set -euo pipefail
          # 統計情報を作る。無いと初回のクエリが極端に遅い
          psql "$DST" -c "ANALYZE;" > /dev/null

          # 突き合わせの結果はログにも出す。サマリーは API から取れないため、
          # ここだけに書くと移行が成功したかを後から機械的に確認できない。
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }

          say "## 突き合わせ"
          say ""
          say "| テーブル | 移行元 | 移行先 | 判定 |"
          say "| --- | ---: | ---: | --- |"

          FAILED=0
          # 判定は「一致」ではなく「欠けていない」で行う。
          # pg_dump のスナップショットは基準の件数を数えた直後に取られるので、
          # その間に入った行は dump に含まれ、移行先が基準より多くなる。
          # これは正常な状態で、完全一致を求めると書き込みが 1 行でもある限り
          # 永久に緑にならない。守りたいのは restore で行が落ちていないこと。
          while read -r T A; do
            B=$(psql "$DST" -At -c "SELECT count(*) FROM \"$T\";" 2>/dev/null || echo "-")
            if [ "$B" = "-" ] || [ "$A" = "-" ]; then
              MARK="❌ 表が無い"; FAILED=1
            elif [ "$B" -lt "$A" ]; then
              MARK="❌ $((A - B)) 行欠けている"; FAILED=1
            elif [ "$B" -gt "$A" ]; then
              MARK="✅ (+$((B - A)) 行、dump 中の追加)"
            else
              MARK="✅"
            fi
            say "| $T | $A | $B | $MARK |"
          done < src_counts.txt

          # 現在の移行元も出す。dump 中に書き込みが続いていれば基準からずれる。
          # ずれていたら、切り替え前にスクレイパーを止めて取り直すこと。
          NOW=$(psql "$SRC" -At -c "SELECT count(*) FROM rental_properties;")
          BASE=$(awk '/^rental_properties /{print $2}' src_counts.txt)
          if [ "$NOW" != "$BASE" ]; then
            say ""
            say "> dump 後に移行元が $BASE → $NOW 行に増えている（スクレイパー稼働中）。"
            say "> 切り替え前にスクレイパーを止めて取り直すこと。"
          fi

          say ""
          say "$(psql "$DST" -At -c "SELECT '移行先のサイズ: ' || pg_size_pretty(pg_database_size(current_database()));")"

          # 索引が無いと物件検索が実用にならない。数だけでも比べる
          IA=$(psql "$SRC" -At -c "SELECT count(*) FROM pg_indexes WHERE schemaname='public';")
          IB=$(psql "$DST" -At -c "SELECT count(*) FROM pg_indexes WHERE schemaname='public';")
          say "索引の数: 移行元 $IA / 移行先 $IB"
          [ "$IA" = "$IB" ] || { echo "::warning::索引の数が一致しない。"; FAILED=1; }

          if [ "$FAILED" != "0" ]; then
            echo "::error::突き合わせに失敗。ENV_FILE はまだ切り替えないこと。"
            exit 1
          fi
          echo "::notice::移行完了。ENV_FILE を切り替えて再デプロイしてよい。"

      - name: Clean up
        if: always()
        run: rm -f portfolio.dump
