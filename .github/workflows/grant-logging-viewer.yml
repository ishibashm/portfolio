# デプロイ用サービスアカウントに roles/logging.viewer を付ける。1 回だけ。
#
# run-error-logs.yml（本番のエラーログを読むだけのワークフロー）が
# PERMISSION_DENIED で止まっていた。読む側の SA（github-deploy）に
# ログ閲覧の役割が無いため。利用者の承認（2026-09-08）で付ける。
#
# 同じ SA の鍵で自分自身に役割を足すので、その SA に
# resourcemanager.projects.setIamPolicy が無ければここも
# PERMISSION_DENIED で止まる。その場合は Cloud Console
# （IAM と管理 → IAM → github-deploy@… を編集 → ロールを追加 →
# 「ログ閲覧者」）で手で付ける。
#
# 足すだけ（add-iam-policy-binding）。他の役割は触らない。二度回しても
# 同じ結果になる。
name: Grant logging.viewer to deploy SA (one-off)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'blog-471319' }}
  MEMBER: serviceAccount:github-deploy@blog-471319.iam.gserviceaccount.com

jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Add roles/logging.viewer
        run: |
          set -euo pipefail
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="$MEMBER" \
            --role="roles/logging.viewer" \
            --condition=None \
            --format="value(bindings.role)" | sort -u | tee -a "$GITHUB_STEP_SUMMARY"
          echo "付けました: $MEMBER に roles/logging.viewer" | tee -a "$GITHUB_STEP_SUMMARY"
