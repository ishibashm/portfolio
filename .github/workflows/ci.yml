# このリポジトリには長らく PR を検査する仕組みが無く、動いていたのは
# deploy.yml（master への push で本番へ出す）だけだった。つまり壊れたコードが
# 入っても、気づくのはデプロイが失敗したときか、本番の画面が壊れてからになる。
#
# 複数のセッションが並行して master に PR を出しているため、片方が壊した型を
# もう片方が踏む経路がある。手元での確認は、確認した人の変更しか担保しない。
#
# ここで回すのは CLAUDE.md が要求している 3 つ（型・テスト・lint）に絞る。
# どれも DB も API キーも要らないので、secret を PR の実行に渡さずに済む。
# 公開リポジトリなので、これは意図的な線引き。
#
# next build はここでは回さない。ビルドは .env（DB 接続文字列を含む）を前提に
# しており、PR の実行に渡すと公開リポジトリで秘密情報を晒す経路になる。
# ビルドの検証は deploy.yml が master で行う。
name: CI

on:
  pull_request:
  push:
    branches: [master]

# 同じ PR に続けて push したとき、古い実行は捨てる。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 2 は下の「lint の警告が増えていないか」のため。PR の実行は
      # base との merge commit を checkout するので、HEAD^1 がちょうど
      # 「この PR が載る先」になる。深さ 1 だとそれが取れない。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Dockerfile が node:20-bookworm-slim なので、そこに合わせる。
      # ここだけ新しくすると、CI が通ってデプロイが落ちる組み合わせが出る。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 素の npm ci で通す（Dockerfile と同じ）。以前は defuddle@0.8.0 が
      # jsdom@^24 を要求して ERESOLVE で落ちたため --legacy-peer-deps を
      # 付けていた。defuddle を jsdom を要求しない 0.19 に上げ、
      # react-simple-maps の react@^18 までの宣言は package.json の
      # overrides で手元の react に揃えた。旗を戻すと peer の食い違いが
      # 再び見えなくなるので付けない。
      - run: npm ci

      # Prisma Client は生成物で、リポジトリには入っていない。
      # 生成しないと tsc が @prisma/client の型を解決できずに落ちる。
      # 接続はしないので、URL は形だけ合っていればよい。
      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # 現状は警告が 678 件あり、これは落とさない（--max-warnings を付けると
      # 初回から全部赤くなる）。ここで止まるのは error だけ。警告を減らすのは
      # 別の作業として切り出す。
      - name: Lint
        run: npm run lint

      # 上の Lint は error しか止めない。CLAUDE.md 1 節の「PR の前後で警告の
      # 総数が増えていないこと」は人の目で確かめており、自分の足したコードで
      # 警告を増やす事故が実際に起きている。
      #
      # 上限を数字（--max-warnings）で書かないのは、総数が環境で変わるため
      # （同じコミットでクラウド 423 / ローカル 434）。同じランナーの中で
      # 比較元（HEAD^1）も数え直し、差だけを見る。master への push では
      # 比べる相手が PR ではないので回さない。
      - name: Lint warnings must not increase
        if: github.event_name == 'pull_request'
        run: node scripts/lint-warning-gate.mjs HEAD^1

      # 暦・天体計算のテストは年単位で日を回すため、1 本で数秒かかる。
      # vitest.config.ts で testTimeout を 30 秒にしてある。
      - name: Test
        run: npm test

      # **本番と同じビルドを通す。**
      #
      # これが無かったせいで、tsc は通るがビルドは落ちる誤りを 1 つも
      # 検出できていなかった。実際に Server Component の中で
      # `dynamic(..., { ssr: false })` を書いてしまい、CI は success の
      # まま**デプロイが 8 回連続で失敗していた**（#497〜#506）。
      #
      # tsc・lint・test はどれも「型」と「振る舞い」しか見ない。App Router
      # の規則（どの境界で何が使えるか）は **next build でしか分からない。**
      #
      # DB には繋がない。URL は形だけ合っていればよく、ビルド時に接続する
      # 処理は無い（あれば、それ自体が直すべき設計）。
      #
      # next-sitemap は含めない。あれは書き出すだけで、落ちるとしたら
      # ビルドが先に落ちる。CI を遅くするだけになる。
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx next build --webpack
