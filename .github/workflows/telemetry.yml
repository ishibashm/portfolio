name: Record Daily Telemetry

# 履歴グラフ用の観測値（磁気嵐指数・X線フラックス・地磁気）を 1 日 1 回記録する。
# 天体黄経・九星・月相は日付から計算できるので記録しない
# （src/lib/telemetrySnapshot.ts）。
#
# これまでこのエンドポイントを叩くものが存在せず、本番のデータは
# 2026-06-27 で止まっていた。

on:
  schedule:
    # 毎日 21:00 UTC = 翌 06:00 JST
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Call telemetry cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set."
            exit 1
          fi
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://cloud-palette.com/api/cron/telemetry)
          echo "HTTP $code"
          cat response.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Telemetry batch failed with HTTP $code"
            exit 1
          fi
